<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری پەروەردەیی گشتگیر</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #278e43;
            --danger: #ed2024;
            --warning: #f9af1b;
            --blue: #2196F3;
            --purple: #9C27B0;
            --text-main: #333333;
        }

        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main);
            text-align: center; 
            margin: 0; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 700px;
            background: var(--card-bg); padding: 15px 20px;
            border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px;
        }

        .flag {
            width: 50px; height: 33px; display: flex; flex-direction: column;
            border-radius: 4px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .flag .red { background: #ed2024; flex: 1; }
        .flag .white { background: #ffffff; flex: 1; display: flex; justify-content: center; align-items: center; position: relative;}
        .flag .white::after { content: '☀️'; position: absolute; font-size: 14px; color: #f9af1b; }
        .flag .green { background: #278e43; flex: 1; }

        .stats { font-size: 18px; font-weight: bold; }
        .stats span { color: var(--primary); margin: 0 5px; font-size: 22px;}

        .game-board {
            background: var(--card-bg); width: 100%; max-width: 700px;
            padding: 25px 20px; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); position: relative; overflow: hidden;
        }

        .categories {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px;
        }
        
        .mode-btn {
            background: #eee; border: none; padding: 10px 15px;
            border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold;
            transition: 0.3s; color: #555;
        }
        .mode-btn:hover { background: #ddd; }
        .mode-btn.active-kurdish { background: var(--primary); color: white; }
        .mode-btn.active-religion { background: var(--warning); color: white; }
        .mode-btn.active-science { background: var(--blue); color: white; }
        .mode-btn.active-math { background: var(--danger); color: white; }
        .mode-btn.active-mixed { background: var(--purple); color: white; }

        #question-area {
            font-size: 26px; margin: 20px 0; min-height: 80px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #222; line-height: 1.5;
        }

        #math-area { font-size: 55px; font-weight: bold; direction: ltr; color: var(--danger); }

        #options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .btn { 
            background-color: #f8f9fa; color: #333; border: 2px solid #ddd; 
            padding: 15px 10px; font-size: 20px; font-weight: bold;
            border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover:not(:disabled) { border-color: var(--primary); background-color: #f0fdf4; }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { cursor: not-allowed; opacity: 0.8; }

        #message { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 35px; transition: 0.3s;}

        .progress-container { width: 100%; background: #eee; border-radius: 10px; margin-top: 20px; height: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--warning); width: 0%; transition: width 0.5s ease; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.3s; }
        .glow { box-shadow: 0 0 20px 10px rgba(39,142,67,0.3) !important; transition: 0.3s; }
        .confetti { position: absolute; width: 10px; height: 10px; opacity: 0; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(200px) rotate(360deg); opacity: 0; } }
        
        @media(max-width: 480px) {
            #options { grid-template-columns: 1fr; }
            #question-area { font-size: 20px; }
            #math-area { font-size: 45px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="flag">
            <div class="red"></div><div class="white"></div><div class="green"></div>
        </div>
        <div class="stats">
            ئاست: <span id="levelDisplay">١</span> | خاڵ: <span id="xpDisplay">٠</span>
        </div>
    </div>

    <div class="game-board" id="board">
        <div class="categories">
            <button class="mode-btn" id="btnMixed" onclick="setMode('mixed')">🔀 تێکەڵ</button>
            <button class="mode-btn" id="btnKurdish" onclick="setMode('kurdish')">📖 کوردی</button>
            <button class="mode-btn" id="btnReligion" onclick="setMode('religion')">🕌 ئاینی</button>
            <button class="mode-btn" id="btnScience" onclick="setMode('science')">🔬 زانست</button>
            <button class="mode-btn" id="btnMath" onclick="setMode('math')">🔢 بیرکاری</button>
        </div>

        <div id="question-area">سڵاو لە پاڵەوان... ئامادەی؟</div>
        <div id="options"></div>
        <p id="message"></p>
        
        <div class="progress-container">
            <div class="progress-bar" id="xpBar"></div>
        </div>
    </div>

    <script>
        function toKurdishNum(num) {
            const kurdishDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return num.toString().replace(/[0-9]/g, w => kurdishDigits[w]);
        }

        // داتابەیسی پرسیارەکان - تێبینی: property ی level زیادکراوە
        // دەتوانیت هەزاران پرسیار لێرە زیاد بکەیت، منداڵەکە تەنها ئەو پرسیارانەی پێ دەدرێت کە لەگەڵ ئاستەکەیدا دەگونجێت
        const database = {
            kurdish: [
                { level: 1, q: "پێچەوانەی وشەی (گەورە) چییە؟", options: ["بچووک", "درێژ", "کورت", "قەڵەو"], a: "بچووک" },
                { level: 1, q: "پایتەختی کوردستان کوێیە؟", options: ["سلێمانی", "هەولێر", "دهۆک", "کەرکوک"], a: "هەولێر" },
                { level: 2, q: "هاوواتای وشەی (خێرا) چییە؟", options: ["توند", "خاو", "بەرەوڕوو", "گورج"], a: "گورج" },
                { level: 3, q: "کام لەم پیتانە بزوێنە؟", options: ["ب", "د", "ۆ", "س"], a: "ۆ" },
                { level: 4, q: "ئەو وشەیەی جێگەی ناو دەگرێتەوە پێی دەوترێت چی؟", options: ["کردار", "ئاوەڵناو", "جێناو", "هاوەڵکار"], a: "جێناو" }
            ],
            religion: [
                { level: 1, q: "یەکەم پێغەمبەر کێ بوو؟", options: ["نوح (د.خ)", "ئادەم (د.خ)", "عیسا (د.خ)", "موسا (د.خ)"], a: "ئادەم (د.خ)" },
                { level: 1, q: "ڕۆژانە چەند فەرزە نوێژ دەکەین؟", options: ["٣", "٤", "٥", "٦"], a: "٥" },
                { level: 2, q: "قورئانی پیرۆز بە چ زمانێک دابەزیوە؟", options: ["کوردی", "فارسی", "عەرەبی", "ئینگلیزی"], a: "عەرەبی" },
                { level: 3, q: "یەکەم سوورەتی قورئان کامەیە؟", options: ["البقرة", "الفاتحة", "الناس", "الإخلاص"], a: "الفاتحة" },
                { level: 4, q: "ئەو فریشتەیەی وەحی هێناوە بۆ پێغەمبەر (د.خ) ناوی چییە؟", options: ["میکائیل", "ئیسرافیل", "عیزرائیل", "جوبرەئیل"], a: "جوبرەئیل" }
            ],
            science: [
                { level: 1, q: "ئێمە بە چی هەناسە دەدەین؟", options: ["سییەکان", "دڵ", "گەدە", "مێشک"], a: "سییەکان" },
                { level: 1, q: "ڕەنگی ئاسمان لە ڕۆژدا چۆنە؟", options: ["سوور", "شین", "سەوز", "زەرد"], a: "شین" },
                { level: 2, q: "ئاو لە چ پلەیەکدا دەیبەستێت؟", options: ["١٠٠", "٥٠", "٠", "١٠"], a: "٠" },
                { level: 3, q: "هەسارەی زەوی بە دەوری چیدا دەسوڕێتەوە؟", options: ["مانگ", "مەریخ", "خۆر", "هەورەکان"], a: "خۆر" },
                { level: 4, q: "خێراترین ئاژەڵ لە جیهاندا کامەیە؟", options: ["شێر", "پڵنگ", "چیتە (شیتا)", "ئەسپی کێوی"], a: "چیتە (شیتا)" }
            ]
        };

        // مۆلیدەی پێشکەوتووی بیرکاری بەپێی ئاست
        function generateMath(currentLevel) {
            let num1, num2, sign, answer;
            
            if (currentLevel <= 2) {
                // ئاستی ١ و ٢: کۆکردنەوە و لێدەرکردنی سادە (١ بۆ ١٠)
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                sign = Math.random() > 0.5 ? '+' : '-';
                if (sign === '-' && num1 < num2) [num1, num2] = [num2, num1]; // هەمیشە گەورەتر یەکەم بێت
            } else if (currentLevel <= 5) {
                // ئاستی ٣ تا ٥: ژمارەی گەورەتر و لێکدانی سادە
                let rand = Math.random();
                if (rand < 0.4) { sign = '+'; num1 = Math.floor(Math.random() * 30) + 5; num2 = Math.floor(Math.random() * 20) + 1; }
                else if (rand < 0.8) { sign = '-'; num1 = Math.floor(Math.random() * 30) + 10; num2 = Math.floor(Math.random() * num1) + 1; }
                else { sign = '×'; num1 = Math.floor(Math.random() * 5) + 2; num2 = Math.floor(Math.random() * 5) + 2; }
            } else {
                // ئاستی ٦ بەرەو سەر: دابەشکردن و لێکدانی گەورەتر
                let rand = Math.random();
                if (rand < 0.3) { sign = '×'; num1 = Math.floor(Math.random() * 9) + 3; num2 = Math.floor(Math.random() * 9) + 2; }
                else if (rand < 0.6) { 
                    sign = '÷'; 
                    num2 = Math.floor(Math.random() * 9) + 2; 
                    answer = Math.floor(Math.random() * 9) + 2; 
                    num1 = num2 * answer; 
                }
                else { sign = '+'; num1 = Math.floor(Math.random() * 100) + 20; num2 = Math.floor(Math.random() * 50) + 10; }
            }

            if (sign === '+') answer = num1 + num2;
            else if (sign === '-') answer = num1 - num2;
            else if (sign === '×') answer = num1 * num2;
            else if (sign === '÷') answer = num1 / num2;

            let qStr = `<span id="math-area" dir="ltr">${toKurdishNum(num1)} ${sign} ${toKurdishNum(num2)}</span>`;
            
            let options = new Set([answer]);
            while (options.size < 4) {
                let offset = Math.floor(Math.random() * 15) - 7;
                let fake = answer + offset;
                if (fake !== answer && fake >= 0) options.add(fake);
            }
            
            return { 
                q: qStr, 
                options: Array.from(options).map(toKurdishNum), 
                a: toKurdishNum(answer) 
            };
        }

        let currentMode = 'mixed';
        let level = parseInt(localStorage.getItem('kurdEduLevel')) || 1;
        let xp = parseInt(localStorage.getItem('kurdEduXP')) || 0;
        let xpNeeded = 100 + (level * 20); // کەمێک سەختتر دەبێت بەپێی ئاست
        let currentAnswer = '';
        let isProcessing = false;

        function updateUI() {
            document.getElementById('levelDisplay').innerText = toKurdishNum(level);
            document.getElementById('xpDisplay').innerText = toKurdishNum(xp);
            let xpPercent = Math.min((xp / xpNeeded) * 100, 100);
            document.getElementById('xpBar').style.width = xpPercent + '%';
        }

        function saveData() {
            localStorage.setItem('kurdEduLevel', level);
            localStorage.setItem('kurdEduXP', xp);
            xpNeeded = 100 + (level * 20);
            updateUI();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.className = 'mode-btn');
            document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add(`active-${mode}`);
            document.getElementById('message').innerText = '';
            loadQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQuestion() {
            isProcessing = false;
            const qArea = document.getElementById('question-area');
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            let questionObj;
            let category = currentMode;

            if (category === 'mixed') {
                const cats = ['kurdish', 'religion', 'science', 'math'];
                category = cats[Math.floor(Math.random() * cats.length)];
            }
            
            if (category === 'math') {
                questionObj = generateMath(level);
            } else {
                // پاڵاوتنی پرسیارەکان بەپێی ئاستی یاریزان
                let availableQs = database[category].filter(q => q.level <= level);
                if (availableQs.length === 0) availableQs = database[category]; // ئەگەر پرسیار نەما، هەمووی پیشان بدە
                
                questionObj = availableQs[Math.floor(Math.random() * availableQs.length)];
            }

            currentAnswer = questionObj.a;
            qArea.innerHTML = questionObj.q;

            let shuffledOptions = shuffleArray([...questionObj.options]);
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement) {
            if (isProcessing) return;
            isProcessing = true;

            const msg = document.getElementById('message');
            const board = document.getElementById('board');
            const allBtns = document.querySelectorAll('.btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === currentAnswer) {
                msg.innerText = 'ئافەرین پاڵەوان! 👏';
                msg.style.color = 'var(--primary)';
                board.classList.add('glow');
                btnElement.style.backgroundColor = 'var(--primary)';
                btnElement.style.color = 'white';
                
                createConfetti();

                xp += 20; // خاڵی زیاتر بۆ وەڵامی ڕاست
                if (xp >= xpNeeded) {
                    level++;
                    xp = 0;
                    msg.innerText = `ئافەرین! سەرکەوتیت بۆ ئاستی ${toKurdishNum(level)} 🎉`;
                }
                saveData();

                setTimeout(() => { 
                    board.classList.remove('glow');
                    msg.innerText = ''; 
                    loadQuestion(); 
                }, 1500);

            } else {
                msg.innerText = 'هەڵەیە، دووبارە هەوڵ بدەرەوە!';
                msg.style.color = 'var(--danger)';
                board.classList.add('shake');
                btnElement.style.backgroundColor = 'var(--danger)';
                btnElement.style.color = 'white';
                
                // کەمکردنەوەی خاڵ لە کاتی هەڵە (بۆ دروستکردنی کێبڕکێ)
                xp = Math.max(0, xp - 5);
                saveData();
                
                setTimeout(() => { 
                    board.classList.remove('shake'); 
                    msg.innerText = '';
                    btnElement.style.backgroundColor = '';
                    btnElement.style.color = '';
                    allBtns.forEach(b => b.disabled = false);
                    isProcessing = false;
                }, 1200);
            }
        }

        function createConfetti() {
            const board = document.getElementById('board');
            const colors = ['#ed2024', '#278e43', '#f9af1b', '#2196F3'];
            for (let i = 0; i < 40; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '10%';
                conf.style.animation = `fall ${Math.random() * 1 + 1}s linear`;
                board.appendChild(conf);
                setTimeout(() => { conf.remove(); }, 2000);
            }
        }

        // دانانی مۆدی سەرەتایی
        setMode('mixed');
        updateUI();
    </script>
</body>
</html>
