<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>یاری بیرکاری کوردی - Kurdish Math Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#58cc02;
    --primary-dark:#46a302;
    --blue:#1cb0f6;
    --blue-dark:#1899d6;
    --orange:#ff9600;
    --orange-dark:#e08600;
    --red:#ff4b4b;
    --red-dark:#d63e3e;
    --purple:#8549ba;
    --bg1:#7f5af0;
    --bg2:#2cb1ff;
    --card:#ffffff;
    --text:#222;
    --muted:#8b8b8b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Vazirmatn', Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    color:var(--text);
    user-select:none;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:14px;
    position:relative;
  }
  .screen{display:none; flex:1; flex-direction:column;}
  .screen.active{display:flex;}

  /* ===== START SCREEN ===== */
  #screen-start{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:18px;
    animation: fadeIn .5s ease;
  }
  .logo-emoji{
    font-size:clamp(60px,18vw,90px);
    animation: floatBounce 2.4s ease-in-out infinite;
  }
  @keyframes floatBounce{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-14px) rotate(3deg);}
  }
  #screen-start h1{
    color:#fff;
    font-size:clamp(24px,7vw,32px);
    margin:0;
    text-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  #screen-start p{
    color:#eaf6ff;
    font-size:clamp(14px,4vw,17px);
    margin:0 0 6px 0;
    max-width:320px;
  }
  .stat-pill-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .stat-pill{
    background:rgba(255,255,255,0.18);
    border:2px solid rgba(255,255,255,0.35);
    border-radius:16px;
    padding:8px 16px;
    color:#fff;
    font-weight:700;
    font-size:14px;
    backdrop-filter: blur(4px);
  }
  .big-btn{
    border:none;
    border-radius:20px;
    padding:18px 50px;
    font-size:clamp(18px,5vw,22px);
    font-weight:800;
    font-family:inherit;
    cursor:pointer;
    color:#fff;
    background: var(--primary);
    border-bottom:6px solid var(--primary-dark);
    box-shadow:0 0 0 rgba(88,204,2,0);
    animation: glowPulse 1.8s ease-in-out infinite;
    transition: transform .08s;
  }
  .big-btn:active{ transform:translateY(4px); border-bottom-width:2px; }
  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 8px 2px rgba(255,255,255,0.25);}
    50%{ box-shadow:0 0 22px 8px rgba(255,255,255,0.55);}
  }
  .link-btn{
    background:none;
    border:none;
    color:#eaf6ff;
    text-decoration:underline;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  #sound-toggle{
    position:absolute;
    top:16px;
    left:16px;
    background:rgba(255,255,255,0.2);
    border:2px solid rgba(255,255,255,0.35);
    border-radius:50%;
    width:42px;
    height:42px;
    font-size:18px;
    cursor:pointer;
    color:#fff;
  }

  /* ===== GAME SCREEN ===== */
  #screen-game{ gap:12px; }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #home-btn{
    background:rgba(255,255,255,0.25);
    border:none;
    border-radius:12px;
    width:40px;height:40px;
    font-size:18px;
    color:#fff;
    cursor:pointer;
    flex-shrink:0;
  }
  .xp-wrap{ flex:1; display:flex; flex-direction:column; gap:4px;}
  .level-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    font-weight:700;
    font-size:13px;
  }
  .xp-bar-bg{
    background:rgba(255,255,255,0.25);
    border-radius:10px;
    height:14px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,0.4);
  }
  .xp-bar-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg,#ffd23f,#ff9600);
    border-radius:10px;
    transition: width .5s cubic-bezier(.4,1.5,.6,1);
  }
  .stats-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
  }
  .stat-box{
    flex:1;
    background:rgba(255,255,255,0.18);
    border-radius:14px;
    padding:8px;
    text-align:center;
    color:#fff;
  }
  .stat-box .num{ font-size:18px; font-weight:800; display:block;}
  .stat-box .lbl{ font-size:11px; opacity:.9;}

  .band-tag{
    align-self:center;
    background:rgba(255,255,255,0.9);
    color:var(--purple);
    font-weight:700;
    font-size:12px;
    padding:5px 14px;
    border-radius:20px;
    margin-top:2px;
  }

  #game-card{
    background:var(--card);
    border-radius:26px;
    padding:26px 18px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:26px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
    margin-top:6px;
  }
  #question-text{
    font-size:clamp(28px,8vw,40px);
    font-weight:800;
    text-align:center;
    direction:ltr;
    unicode-bidi:isolate;
    color:#333;
    letter-spacing:1px;
    line-height:1.4;
  }
  .choices-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
  }
  .choice-btn{
    font-family:inherit;
    font-size:clamp(20px,6vw,26px);
    font-weight:800;
    padding:18px 6px;
    border-radius:16px;
    border:none;
    border-bottom:5px solid rgba(0,0,0,0.18);
    cursor:pointer;
    color:#fff;
    direction:ltr;
    transition: transform .08s, box-shadow .2s;
  }
  .choice-btn:nth-child(1){ background:var(--blue); border-bottom-color:var(--blue-dark);}
  .choice-btn:nth-child(2){ background:var(--orange); border-bottom-color:var(--orange-dark);}
  .choice-btn:nth-child(3){ background:var(--purple); border-bottom-color:#5f3488;}
  .choice-btn:nth-child(4){ background:var(--primary); border-bottom-color:var(--primary-dark);}
  .choice-btn:active:not(:disabled){ transform:translateY(4px); border-bottom-width:1px; }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{
    background:var(--primary) !important;
    border-bottom-color:var(--primary-dark) !important;
    box-shadow:0 0 20px 4px rgba(88,204,2,0.8);
    animation: pop .35s ease;
  }
  .choice-btn.wrong{
    background:var(--red) !important;
    border-bottom-color:var(--red-dark) !important;
    box-shadow:0 0 20px 4px rgba(255,75,75,0.8);
  }
  @keyframes pop{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
  }
  .shake{ animation: shakeAnim .5s; }
  @keyframes shakeAnim{
    10%,90%{transform:translateX(-3px);}
    20%,80%{transform:translateX(6px);}
    30%,50%,70%{transform:translateX(-10px);}
    40%,60%{transform:translateX(10px);}
  }

  #feedback-line{
    min-height:22px;
    font-weight:700;
    font-size:14px;
    text-align:center;
    color:var(--muted);
  }

  /* Confetti */
  #confetti-container{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;
  }
  .confetti-piece{
    position:absolute;
    top:-20px;
    width:9px;
    height:15px;
    opacity:0.95;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    to{ transform: translateY(115vh) rotate(560deg); opacity:0.1; }
  }

  /* Level up toast */
  #levelup-toast{
    position:fixed;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(135deg,#ffd23f,#ff9600);
    color:#5a3700;
    padding:16px 30px;
    border-radius:20px;
    font-weight:800;
    font-size:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    z-index:1000;
    text-align:center;
    transition: top .5s cubic-bezier(.4,1.6,.6,1);
  }
  #levelup-toast.show{ top:24px; }

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  @media (max-width:340px){
    .choice-btn{ font-size:18px; padding:14px 4px; }
    #question-text{ font-size:26px; }
  }
</style>
</head>
<body>
<div id="app">

  <button id="sound-toggle" title="دەنگ">🔊</button>

  <!-- START SCREEN -->
  <div class="screen active" id="screen-start">
    <div class="logo-emoji">🧮</div>
    <h1>یاری بیرکاری کوردی</h1>
    <p>فێربوونی بیرکاری بە شێوەیەکی خۆش و یاری‌مانەیی! لە سەرەتاوە بگەرە بۆ ئاستی پرۆ 🚀</p>
    <div class="stat-pill-row">
      <div class="stat-pill">🏆 باشترین خاڵ: <span id="start-highscore">٠</span></div>
      <div class="stat-pill">⭐ پلە: <span id="start-level">١</span></div>
    </div>
    <button class="big-btn" id="start-btn">دەستپێکردن ▶</button>
    <button class="link-btn" id="reset-btn">دەستپێکردنەوەی یاری لە سەرەتا</button>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screen-game">
    <div class="topbar">
      <button id="home-btn" title="گەڕانەوە">🏠</button>
      <div class="xp-wrap">
        <div class="level-row">
          <span>پلە <span id="hud-level">١</span></span>
          <span id="hud-xp-text">٠ / ١٠٠</span>
        </div>
        <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-fill"></div></div>
      </div>
    </div>

    <div class="band-tag" id="band-tag">کۆکردنەوە و لێدەرکردن</div>

    <div class="stats-row">
      <div class="stat-box">🔥 <span class="num" id="hud-streak">٠</span><span class="lbl">زنجیرە</span></div>
      <div class="stat-box">💯 <span class="num" id="hud-score">٠</span><span class="lbl">خاڵ</span></div>
      <div class="stat-box">🏆 <span class="num" id="hud-high">٠</span><span class="lbl">باشترین</span></div>
    </div>

    <div id="game-card">
      <div id="question-text">؟</div>
      <div class="choices-grid">
        <button class="choice-btn" data-idx="0"></button>
        <button class="choice-btn" data-idx="1"></button>
        <button class="choice-btn" data-idx="2"></button>
        <button class="choice-btn" data-idx="3"></button>
      </div>
      <div id="feedback-line">&nbsp;</div>
    </div>
  </div>

</div>

<div id="confetti-container"></div>
<div id="levelup-toast">🎉 پلەیەکی نوێ! پلە <span id="levelup-num">٢</span></div>

<script>
(function(){
  "use strict";

  /* ============ KURDISH NUMERAL UTILS ============ */
  const KD = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩','.':'٫','-':'-'};
  function nk(input){
    return String(input).split('').map(ch => KD[ch] !== undefined ? KD[ch] : ch).join('');
  }

  const PLUS='+', MINUS='−', TIMES='×', DIV='÷', Q='؟';

  /* ============ HELPERS ============ */
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a || 1; }

  /* ============ CURRICULUM ENGINE ============ */

  function genAddSub(level){
    let max;
    if(level<=3) max=9;
    else if(level<=6) max=20;
    else max=99;
    const isAdd = Math.random()<0.5;
    let a,b,answer,text;
    if(isAdd){
      a = randInt(1,max); b = randInt(1,max);
      answer = a+b;
      text = `${nk(a)} ${PLUS} ${nk(b)} = ${Q}`;
    } else {
      a = randInt(1,max); b = randInt(0,a);
      answer = a-b;
      text = `${nk(a)} ${MINUS} ${nk(b)} = ${Q}`;
    }
    return {text, answer, decimals:0};
  }

  function genMultDiv(level){
    const tableMax = level<=14 ? 6 : (level<=17 ? 9 : 12);
    const isMul = Math.random()<0.5;
    let a,b,answer,text,customDistractors;
    if(isMul){
      a = randInt(1,tableMax); b = randInt(1,12);
      answer = a*b;
      text = `${nk(a)} ${TIMES} ${nk(b)} = ${Q}`;
      customDistractors = [a+b, a*(b+1), Math.abs(a*(b-1))];
    } else {
      const d = randInt(1,tableMax); const qv = randInt(1,12);
      const dividend = d*qv;
      answer = qv;
      text = `${nk(dividend)} ${DIV} ${nk(d)} = ${Q}`;
      customDistractors = [qv+1, Math.max(0,qv-1), d];
    }
    return {text, answer, decimals:0, customDistractors};
  }

  function evalExpr(a,op1,b,op2,c){
    if(op1==='×' && op2==='×') return a*b*c;
    if(op1==='×'){ const left=a*b; return op2==='+' ? left+c : left-c; }
    if(op2==='×'){ const right=b*c; return op1==='+' ? a+right : a-right; }
    const mid = op1==='+' ? a+b : a-b;
    return op2==='+' ? mid+c : mid-c;
  }
  function evalLeftToRight(a,op1,b,op2,c){
    let v = op1==='+' ? a+b : (op1==='-' ? a-b : a*b);
    v = op2==='+' ? v+c : (op2==='-' ? v-c : v*c);
    return v;
  }

  function genMixed(level){
    const ops = ['+','-','×'];
    const maxNum = level<=25 ? 10 : 15;
    for(let attempt=0; attempt<30; attempt++){
      const a=randInt(1,maxNum), b=randInt(1,maxNum), c=randInt(1,maxNum);
      const op1=ops[randInt(0,2)], op2=ops[randInt(0,2)];
      const val = evalExpr(a,op1,b,op2,c);
      if(Number.isInteger(val) && val>=0 && val<=999){
        const wrongOrder = evalLeftToRight(a,op1,b,op2,c);
        const s1 = op1==='×'?TIMES:(op1==='-'?MINUS:PLUS);
        const s2 = op2==='×'?TIMES:(op2==='-'?MINUS:PLUS);
        const text = `${nk(a)} ${s1} ${nk(b)} ${s2} ${nk(c)} = ${Q}`;
        const customDistractors = (wrongOrder!==val && wrongOrder>=0) ? [wrongOrder] : [];
        return {text, answer: val, decimals:0, customDistractors};
      }
    }
    const a=randInt(1,10), b=randInt(1,10);
    return {text:`${nk(a)} ${PLUS} ${nk(b)} = ${Q}`, answer:a+b, decimals:0};
  }

  function genMissing(level){
    const maxNum = level<=35 ? 20 : 50;
    const opsPool = ['+','-','×','÷'];
    for(let attempt=0; attempt<30; attempt++){
      const op = opsPool[randInt(0,3)];
      const unkFirst = Math.random()<0.5;
      let text, answer;
      if(op==='+'){
        const a=randInt(1,maxNum), b=randInt(1,maxNum), sum=a+b;
        if(unkFirst){ answer=a; text=`🔲 ${PLUS} ${nk(b)} = ${nk(sum)}`; }
        else { answer=b; text=`${nk(a)} ${PLUS} 🔲 = ${nk(sum)}`; }
      } else if(op==='-'){
        const a=randInt(1,maxNum), b=randInt(0,a), diff=a-b;
        if(unkFirst){ answer=a; text=`🔲 ${MINUS} ${nk(b)} = ${nk(diff)}`; }
        else { answer=b; text=`${nk(a)} ${MINUS} 🔲 = ${nk(diff)}`; }
      } else if(op==='×'){
        const a=randInt(1,12), b=randInt(1,12), prod=a*b;
        if(unkFirst){ answer=a; text=`🔲 ${TIMES} ${nk(b)} = ${nk(prod)}`; }
        else { answer=b; text=`${nk(a)} ${TIMES} 🔲 = ${nk(prod)}`; }
      } else {
        const b=randInt(1,12), qv=randInt(1,12), a=b*qv;
        if(unkFirst){ answer=a; text=`🔲 ${DIV} ${nk(b)} = ${nk(qv)}`; }
        else { answer=b; text=`${nk(a)} ${DIV} 🔲 = ${nk(qv)}`; }
      }
      if(Number.isInteger(answer) && answer>=0 && answer<=999){
        return {text, answer, decimals:0};
      }
    }
    const a=randInt(1,20), b=randInt(1,20);
    return {text:`🔲 ${PLUS} ${nk(b)} = ${nk(a+b)}`, answer:a, decimals:0};
  }

  function genAdvanced(level){
    const subtype = randInt(0,2);
    if(subtype===0){
      const denomOptions=[3,4,5,6,8,10];
      const d = denomOptions[randInt(0,denomOptions.length-1)];
      const n1 = randInt(1,d-2);
      const n2 = randInt(1, Math.max(1, d-1-n1));
      const sumNum = n1+n2;
      const g = gcd(sumNum,d);
      const rn = sumNum/g, rd = d/g;
      const text = `${nk(n1)}/${nk(d)} ${PLUS} ${nk(n2)}/${nk(d)} = ${Q}`;
      return {text, type:'fraction', rawNum:rn, rawDen:rd};
    } else if(subtype===1){
      let a = randInt(10,99)/10;
      let b = randInt(10,99)/10;
      let isAdd = Math.random()<0.5;
      if(!isAdd && b>a) isAdd = true;
      let answer, text;
      if(isAdd){
        answer = +(a+b).toFixed(1);
        text = `${nk(a.toFixed(1))} ${PLUS} ${nk(b.toFixed(1))} = ${Q}`;
      } else {
        answer = +(a-b).toFixed(1);
        text = `${nk(a.toFixed(1))} ${MINUS} ${nk(b.toFixed(1))} = ${Q}`;
      }
      return {text, answer, decimals:1};
    } else {
      const root = randInt(2,15);
      const sq = root*root;
      const text = `√${nk(sq)} = ${Q}`;
      return {text, answer: root, decimals:0};
    }
  }

  function genPro(level){
    const subtype = randInt(0,2);
    if(subtype===0){
      const power = Math.random()<0.7 ? 2 : 3;
      const base = power===2 ? randInt(2,12) : randInt(2,6);
      const answer = Math.pow(base,power);
      const sup = power===2 ? '²' : '³';
      const text = `${nk(base)}${sup} = ${Q}`;
      const customDistractors = [Math.pow(base-1,power), Math.pow(base+1,power), base*power];
      return {text, answer, decimals:0, customDistractors};
    } else if(subtype===1){
      for(let attempt=0; attempt<30; attempt++){
        const a=randInt(1,15), b=randInt(1,15), c=randInt(1,15);
        const ops=['+','-','×'];
        const op1=ops[randInt(0,2)], op2=ops[randInt(0,2)];
        const inner = op1==='+'?a+b:(op1==='-'?a-b:a*b);
        if(inner<0) continue;
        const val = op2==='+'?inner+c:(op2==='-'?inner-c:inner*c);
        if(Number.isInteger(val) && val>=0 && val<=9999){
          const s1 = op1==='×'?TIMES:(op1==='-'?MINUS:PLUS);
          const s2 = op2==='×'?TIMES:(op2==='-'?MINUS:PLUS);
          const text = `(${nk(a)} ${s1} ${nk(b)}) ${s2} ${nk(c)} = ${Q}`;
          return {text, answer: val, decimals:0};
        }
      }
      return {text:`(${nk(2)} ${PLUS} ${nk(3)}) ${TIMES} ${nk(2)} = ${Q}`, answer:10, decimals:0};
    } else {
      const a=randInt(2,10), unknown=randInt(1,10), b=randInt(1,20);
      const c = unknown*a+b;
      const text = `🔲 ${TIMES} ${nk(a)} ${PLUS} ${nk(b)} = ${nk(c)}`;
      return {text, answer: unknown, decimals:0};
    }
  }

  function generateQuestion(level){
    if(level<=10) return genAddSub(level);
    if(level<=20) return genMultDiv(level);
    if(level<=30) return genMixed(level);
    if(level<=40) return genMissing(level);
    if(level<=50) return genAdvanced(level);
    return genPro(level);
  }

  function bandName(level){
    if(level<=10) return 'کۆکردنەوە و لێدەرکردن';
    if(level<=20) return 'زەرب و دابەشکردن';
    if(level<=30) return 'کارلێکی تێکەڵ (ڕیزبەندی کردار)';
    if(level<=40) return 'دۆزینەوەی ژمارەی ون بوو';
    if(level<=50) return 'کەسر، ژمارەی دەیی و ڕەگی دووجا';
    return 'ئاستی پرۆ 🏅';
  }

  /* ============ DISTRACTOR GENERATION ============ */

  function numericDistractors(answer, decimals, level){
    const results = [];
    const range = Math.max(3, Math.round(Math.abs(answer)*0.3)+2);
    let guard=0;
    while(results.length<8 && guard<80){
      guard++;
      const offsetBase = randInt(1, range);
      const sign = Math.random()<0.5?-1:1;
      let candidate = decimals>0
        ? +(answer + offsetBase*sign*Math.pow(10,-decimals)).toFixed(decimals)
        : answer + offsetBase*sign;
      if(candidate<0) continue;
      const key = decimals>0 ? candidate.toFixed(decimals) : String(candidate);
      if(!results.includes(key)) results.push(key);
    }
    return results;
  }

  function fractionDistractors(num, den){
    const results = [];
    const correctKey = `${num}/${den}`;
    let guard=0;
    while(results.length<8 && guard<80){
      guard++;
      let dn = num + randInt(-2,2);
      let dd = den;
      if(Math.random()<0.3) dd = den + (Math.random()<0.5?1:-1);
      if(dn<=0 || dd<=0) continue;
      const g = gcd(dn,dd);
      const key = `${dn/g}/${dd/g}`;
      if(key!==correctKey && !results.includes(key)) results.push(key);
    }
    return results;
  }

  function displayKey(key){
    const s = String(key);
    if(s.includes('/')){
      const [n,d] = s.split('/');
      return `${nk(n)}${'/'}${nk(d)}`;
    }
    return nk(s);
  }

  function buildQuestion(level){
    const q = generateQuestion(level);
    let correctKey, choices;

    if(q.type==='fraction'){
      correctKey = `${q.rawNum}/${q.rawDen}`;
      const set = new Set([correctKey]);
      const more = fractionDistractors(q.rawNum, q.rawDen);
      for(const m of more){ if(set.size>=4) break; set.add(m); }
      choices = Array.from(set);
      let guard=0;
      while(choices.length<4 && guard<30){ guard++; choices.push(`${randInt(1,9)}/${randInt(2,10)}`); }
      choices = Array.from(new Set(choices)).slice(0,4);
    } else {
      const decimals = q.decimals||0;
      correctKey = decimals>0 ? Number(q.answer).toFixed(decimals) : String(Math.round(q.answer));
      const set = new Set([correctKey]);
      (q.customDistractors||[]).forEach(cd=>{
        if(cd===undefined || cd===null) return;
        const num = Number(cd);
        if(!Number.isFinite(num) || num<0) return;
        const k = decimals>0 ? num.toFixed(decimals) : String(Math.round(num));
        if(k!==correctKey) set.add(k);
      });
      if(set.size<4){
        const more = numericDistractors(q.answer, decimals, level);
        for(const m of more){ if(set.size>=4) break; if(m!==correctKey) set.add(m); }
      }
      choices = Array.from(set);
      let guard=0;
      while(choices.length<4 && guard<50){
        guard++;
        const extra = decimals>0
          ? (Number(correctKey)+ (guard*0.5+1)).toFixed(decimals)
          : String(Number(correctKey)+guard+1);
        if(!choices.includes(extra)) choices.push(extra);
      }
      choices = choices.slice(0,4);
    }

    return { text:q.text, correctKey, choices: shuffle(choices) };
  }

  /* ============ AUDIO ============ */
  let audioCtx=null, soundOn=true;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
  }
  function playTone(freq,duration,type='sine',vol=0.15){
    if(!audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type=type; osc.frequency.value=freq;
      gain.gain.value=vol;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+duration);
      osc.stop(audioCtx.currentTime+duration+0.05);
    }catch(e){}
  }
  function playCorrectSound(){ if(!soundOn) return; ensureAudio(); playTone(880,0.12); setTimeout(()=>playTone(1175,0.15),100); }
  function playWrongSound(){ if(!soundOn) return; ensureAudio(); playTone(170,0.28,'sawtooth',0.12); }
  function playLevelUpSound(){ if(!soundOn) return; ensureAudio(); playTone(660,0.1); setTimeout(()=>playTone(880,0.1),110); setTimeout(()=>playTone(1320,0.2),220); }

  /* ============ GAME STATE ============ */
  const STORAGE_KEY = 'kurdish_math_game_v1';
  let state = { level:1, xp:0, score:0, streak:0, highscore:0 };

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state = Object.assign(state, parsed);
      }
    }catch(e){}
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function xpToNext(level){ return 100 + (level-1)*15; }

  let currentQ = null;
  let answering = false;

  /* ============ DOM REFS ============ */
  const screenStart = document.getElementById('screen-start');
  const screenGame = document.getElementById('screen-game');
  const startHighscoreEl = document.getElementById('start-highscore');
  const startLevelEl = document.getElementById('start-level');
  const startBtn = document.getElementById('start-btn');
  const resetBtn = document.getElementById('reset-btn');
  const homeBtn = document.getElementById('home-btn');
  const soundToggle = document.getElementById('sound-toggle');

  const hudLevel = document.getElementById('hud-level');
  const hudXpText = document.getElementById('hud-xp-text');
  const xpFill = document.getElementById('xp-fill');
  const hudStreak = document.getElementById('hud-streak');
  const hudScore = document.getElementById('hud-score');
  const hudHigh = document.getElementById('hud-high');
  const bandTag = document.getElementById('band-tag');

  const questionTextEl = document.getElementById('question-text');
  const gameCard = document.getElementById('game-card');
  const choiceButtons = Array.from(document.querySelectorAll('.choice-btn'));
  const feedbackLine = document.getElementById('feedback-line');
  const confettiContainer = document.getElementById('confetti-container');
  const levelupToast = document.getElementById('levelup-toast');
  const levelupNum = document.getElementById('levelup-num');

  /* ============ SCREEN SWITCH ============ */
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function refreshStartScreen(){
    startHighscoreEl.textContent = nk(state.highscore);
    startLevelEl.textContent = nk(state.level);
  }

  /* ============ HUD ============ */
  function updateHUD(){
    const need = xpToNext(state.level);
    hudLevel.textContent = nk(state.level);
    hudXpText.textContent = `${nk(state.xp)} / ${nk(need)}`;
    xpFill.style.width = Math.min(100,(state.xp/need)*100) + '%';
    hudStreak.textContent = nk(state.streak);
    hudScore.textContent = nk(state.score);
    hudHigh.textContent = nk(state.highscore);
    bandTag.textContent = bandName(state.level);
  }

  /* ============ CONFETTI ============ */
  function spawnConfetti(){
    const colors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff9600'];
    for(let i=0;i<28;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random()*100 + '%';
      piece.style.background = colors[randInt(0,colors.length-1)];
      piece.style.animationDuration = (Math.random()*1 + 1.1) + 's';
      piece.style.animationDelay = (Math.random()*0.25) + 's';
      piece.style.borderRadius = Math.random()<0.5 ? '50%' : '2px';
      confettiContainer.appendChild(piece);
      setTimeout(()=>piece.remove(), 2400);
    }
  }

  function showLevelUpToast(level){
    levelupNum.textContent = nk(level);
    levelupToast.classList.add('show');
    playLevelUpSound();
    spawnConfetti();
    setTimeout(()=>levelupToast.classList.remove('show'), 1900);
  }

  /* ============ QUESTION FLOW ============ */
  function loadQuestion(){
    currentQ = buildQuestion(state.level);
    questionTextEl.textContent = currentQ.text;
    feedbackLine.textContent = '\u00A0';
    choiceButtons.forEach((btn, i)=>{
      const key = currentQ.choices[i];
      btn.dataset.key = key;
      btn.textContent = displayKey(key);
      btn.disabled = false;
      btn.classList.remove('correct','wrong');
    });
    answering = false;
  }

  function clearChoiceClasses(){
    choiceButtons.forEach(btn=>btn.classList.remove('correct','wrong'));
    gameCard.classList.remove('shake');
  }

  function checkLevelUp(){
    let need = xpToNext(state.level);
    let leveled = false;
    while(state.xp >= need){
      state.xp -= need;
      state.level++;
      leveled = true;
      need = xpToNext(state.level);
    }
    if(state.score > state.highscore) state.highscore = state.score;
    if(leveled) showLevelUpToast(state.level);
  }

  function handleCorrect(){
    playCorrectSound();
    spawnConfetti();
    feedbackLine.textContent = 'وەڵامی ڕاستە! 🎉';
    feedbackLine.style.color = '#2fa300';
    const gain = 10 + Math.min(state.streak,10)*2;
    state.streak++;
    state.xp += gain;
    state.score += gain;
    checkLevelUp();
    updateHUD();
    saveState();
    setTimeout(()=>{ clearChoiceClasses(); loadQuestion(); }, 900);
  }

  function handleWrong(){
    playWrongSound();
    feedbackLine.textContent = `هەڵەیە! وەڵامی ڕاست: ${displayKey(currentQ.correctKey)}`;
    feedbackLine.style.color = '#d63e3e';
    state.streak = 0;
    state.xp = Math.max(0, state.xp - 5);
    if(state.score > state.highscore) state.highscore = state.score;
    updateHUD();
    saveState();
    setTimeout(()=>{ clearChoiceClasses(); loadQuestion(); }, 1500);
  }

  function selectAnswer(btn){
    if(answering) return;
    answering = true;
    choiceButtons.forEach(b=>b.disabled=true);
    const key = btn.dataset.key;
    if(key === currentQ.correctKey){
      btn.classList.add('correct');
      handleCorrect();
    } else {
      btn.classList.add('wrong');
      choiceButtons.forEach(b=>{ if(b.dataset.key===currentQ.correctKey) b.classList.add('correct'); });
      gameCard.classList.add('shake');
      handleWrong();
    }
  }

  choiceButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>selectAnswer(btn));
  });

  /* ============ NAV / SETUP ============ */
  startBtn.addEventListener('click', ()=>{
    ensureAudio();
    showScreen('screen-game');
    updateHUD();
    loadQuestion();
  });

  resetBtn.addEventListener('click', ()=>{
    if(confirm('دڵنیایت لە دەستپێکردنەوەی یاری لە سەرەتاوە؟')){
      state = { level:1, xp:0, score:0, streak:0, highscore: state.highscore };
      saveState();
      refreshStartScreen();
    }
  });

  homeBtn.addEventListener('click', ()=>{
    if(state.score > state.highscore) state.highscore = state.score;
    saveState();
    refreshStartScreen();
    showScreen('screen-start');
  });

  soundToggle.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
    if(soundOn) ensureAudio();
  });

  /* ============ INIT ============ */
  loadState();
  refreshStartScreen();
  showScreen('screen-start');

})();
</script>
</body>
</html>
