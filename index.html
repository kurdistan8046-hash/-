<!DOCTYPE html>
<html dir="rtl" lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>یاری فێربوون - وەرزشی مێشک</title>
<style>
  :root{
    --red:#ed2024;
    --white:#ffffff;
    --green:#278e43;
    --yellow:#f9af1b;
    --ink:#2b2440;
    --paper:#fbf5e9;
    --card:#ffffff;
    --teal:#1e8a86;
    --coral:#e8663f;
    --mustard:#d99b1a;
    --plum:#7a4a9c;
    --shadow: 0 10px 26px rgba(43,36,64,0.14);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(249,175,27,0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(30,138,134,0.14), transparent 45%),
      var(--paper);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Geneva, Verdana, sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:14px 16px 40px;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border-radius:22px;
    padding:12px 16px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .flag{
    width:64px;
    height:44px;
    border-radius:8px;
    overflow:hidden;
    flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,0.18);
    position:relative;
    border:1px solid rgba(0,0,0,0.06);
  }
  .flag .stripe{width:100%;height:33.33%;}
  .flag .stripe.top{background:var(--red);}
  .flag .stripe.mid{background:var(--white);position:relative;}
  .flag .stripe.bot{background:var(--green);}
  .sun{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:24px;height:24px;
    border-radius:50%;
    background:repeating-conic-gradient(var(--yellow) 0deg 8.57deg, transparent 8.57deg 17.14deg);
  }
  .sun::after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:var(--white);
  }
  .title-block{flex:1;min-width:0;}
  .title-block h1{
    margin:0;
    font-size:1.18rem;
    line-height:1.3;
  }
  .title-block p{
    margin:2px 0 0;
    font-size:0.8rem;
    color:#6b6280;
  }
  .reset-btn{
    flex:none;
    background:none;
    border:1.5px solid #e3ddce;
    color:#8a8298;
    border-radius:12px;
    padding:8px 10px;
    font-size:0.72rem;
    cursor:pointer;
    line-height:1.2;
  }
  .reset-btn:hover{border-color:var(--coral);color:var(--coral);}

  /* ---------- PROGRESS ---------- */
  .progress-card{
    background:var(--card);
    border-radius:18px;
    padding:12px 16px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .level-badge{
    flex:none;
    width:46px;height:46px;
    border-radius:50%;
    background:linear-gradient(145deg,var(--teal),#166663);
    color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:700;
    font-size:0.95rem;
    line-height:1;
  }
  .level-badge small{font-size:0.55rem;font-weight:500;opacity:0.85;margin-bottom:2px;}
  .xp-area{flex:1;}
  .xp-label{font-size:0.72rem;color:#8a8298;margin-bottom:4px;display:flex;justify-content:space-between;}
  .xp-bar{
    height:12px;
    background:#eee5d1;
    border-radius:8px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    background:linear-gradient(90deg,var(--yellow),var(--coral));
    border-radius:8px;
    transition:width 0.5s ease;
    width:0%;
  }

  /* ---------- MODE SWITCH ---------- */
  .modes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .mode-btn{
    border:none;
    border-radius:16px;
    padding:13px 10px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    background:#efe8d8;
    color:#8a8298;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .mode-btn span.ic{font-size:1.2rem;}
  .mode-btn.active{
    background:linear-gradient(145deg,var(--teal),#166663);
    color:#fff;
    box-shadow:0 8px 18px rgba(30,138,134,0.35);
    transform:translateY(-1px);
  }
  .mode-btn:not(.active):hover{background:#e6ddc6;}

  /* ---------- GAME CARD ---------- */
  .game-card{
    background:var(--card);
    border-radius:24px;
    padding:26px 20px 22px;
    box-shadow:var(--shadow);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .prompt{
    font-size:4.6rem;
    line-height:1;
    margin-bottom:6px;
    user-select:none;
  }
  .prompt.equation{
    font-size:2.5rem;
    font-weight:800;
    direction:ltr;
    color:var(--ink);
    letter-spacing:1px;
  }
  .sub-hint{
    font-size:0.82rem;
    color:#a89fb5;
    margin-bottom:20px;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .choice-btn{
    border:none;
    border-radius:16px;
    padding:16px 8px;
    font-size:1.15rem;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.12);
    transition:transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
  }
  .choice-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.12);}
  .choice-btn.c0{background:var(--teal);}
  .choice-btn.c1{background:var(--coral);}
  .choice-btn.c2{background:var(--mustard);}
  .choice-btn.c3{background:var(--plum);}
  .choice-btn.correct-flash{
    background:var(--green) !important;
    box-shadow:0 0 0 4px rgba(39,142,67,0.35);
  }
  .choice-btn.wrong-flash{
    background:var(--red) !important;
    box-shadow:0 0 0 4px rgba(237,32,36,0.3);
  }
  .choice-btn[disabled]{cursor:default;filter:grayscale(0.15);}

  .feedback{
    min-height:34px;
    margin-top:16px;
    font-size:1.15rem;
    font-weight:800;
  }
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}

  .shake{animation:shakeAnim 0.4s ease;}
  @keyframes shakeAnim{
    10%,90%{transform:translateX(-3px);}
    20%,80%{transform:translateX(6px);}
    30%,50%,70%{transform:translateX(-10px);}
    40%,60%{transform:translateX(10px);}
  }

  .glow-pulse{animation:glowPulse 0.6s ease;}
  @keyframes glowPulse{
    0%{box-shadow:0 0 0 0 rgba(39,142,67,0.5);}
    70%{box-shadow:0 0 0 22px rgba(39,142,67,0);}
    100%{box-shadow:0 0 0 0 rgba(39,142,67,0);}
  }

  /* confetti */
  .confetti-piece{
    position:fixed;
    top:-10px;
    width:9px;height:14px;
    z-index:999;
    pointer-events:none;
    border-radius:2px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.85; }
  }

  footer{
    text-align:center;
    font-size:0.7rem;
    color:#a89fb5;
    margin-top:18px;
  }

  @media (prefers-reduced-motion: reduce){
    .shake, .glow-pulse, .confetti-piece{animation:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="flag">
      <div class="stripe top"></div>
      <div class="stripe mid"><div class="sun"></div></div>
      <div class="stripe bot"></div>
    </div>
    <div class="title-block">
      <h1>یاری فێربوون</h1>
      <p>خوێندنەوە و بیرکاری بۆ منداڵان</p>
    </div>
    <button class="reset-btn" id="resetBtn" title="بۆ دایک و باوکان: پێشکەوتن ڕیسێت بکە">ڕیسێت</button>
  </header>

  <div class="progress-card">
    <div class="level-badge">
      <small>ئاست</small>
      <span id="levelDisplay">1</span>
    </div>
    <div class="xp-area">
      <div class="xp-label">
        <span>خاڵی زیرەکی</span>
        <span id="xpText">0 / 50</span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn active" id="readBtn"><span class="ic">📖</span> خوێندنەوە</button>
    <button class="mode-btn" id="mathBtn"><span class="ic">➕</span> بیرکاری</button>
  </div>

  <div class="game-card" id="gameCard">
    <div class="prompt" id="promptEl">🐱</div>
    <div class="sub-hint" id="hintEl">وشەی ڕاست هەڵبژێرە</div>
    <div class="choices" id="choicesEl"></div>
    <div class="feedback" id="feedbackEl"></div>
  </div>

  <footer>دروستکراوە بۆ منداڵانی کورد 🌿</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- DATA ---------------- */
  var WORDS = [
    {w:"پشیله", e:"🐱"}, {w:"سەگ", e:"🐶"}, {w:"ئەسپ", e:"🐴"}, {w:"مانگا", e:"🐄"},
    {w:"بەرخ", e:"🐑"}, {w:"مریشک", e:"🐔"}, {w:"باڵندە", e:"🐦"}, {w:"ماسی", e:"🐟"},
    {w:"شێر", e:"🦁"}, {w:"فیل", e:"🐘"}, {w:"کەروێشک", e:"🐰"}, {w:"ورچ", e:"🐻"},
    {w:"مار", e:"🐍"}, {w:"بەقە", e:"🐸"}, {w:"گورگ", e:"🐺"},
    {w:"نان", e:"🍞"}, {w:"برنج", e:"🍚"}, {w:"گۆشت", e:"🍖"}, {w:"سێو", e:"🍎"},
    {w:"پرتەقاڵ", e:"🍊"}, {w:"مۆز", e:"🍌"}, {w:"هەنگوین", e:"🍯"}, {w:"شیر", e:"🥛"},
    {w:"هێلکە", e:"🥚"}, {w:"پەنیر", e:"🧀"}, {w:"چای", e:"🍵"}, {w:"کیک", e:"🎂"},
    {w:"خەیار", e:"🥒"}, {w:"تەماتە", e:"🍅"}, {w:"ترێ", e:"🍇"},
    {w:"ماڵ", e:"🏠"}, {w:"دەرگا", e:"🚪"}, {w:"پەنجەرە", e:"🪟"}, {w:"کورسی", e:"🪑"},
    {w:"جێگا", e:"🛏️"}, {w:"چرا", e:"💡"}, {w:"کلیل", e:"🔑"}, {w:"کتێب", e:"📖"},
    {w:"تۆپ", e:"⚽"}, {w:"تەلەفزیۆن", e:"📺"},
    {w:"خۆر", e:"☀️"}, {w:"مانگ", e:"🌙"}, {w:"ئەستێرە", e:"⭐"}, {w:"دار", e:"🌳"},
    {w:"گوڵ", e:"🌸"}, {w:"باران", e:"🌧️"}, {w:"بەفر", e:"❄️"}, {w:"شاخ", e:"⛰️"},
    {w:"دەریا", e:"🌊"}, {w:"هەور", e:"☁️"},
    {w:"سوور", e:"🔴"}, {w:"سپی", e:"⚪"}, {w:"شین", e:"🔵"}, {w:"زەرد", e:"🟡"},
    {w:"سەوز", e:"🟢"}, {w:"ڕەش", e:"⚫"}
  ];

  var PRAISE = ["ئافەرین!", "تۆ زۆر زیرەکی!", "مامۆستای گەورەی!", "کارێکی نایابت کرد!", "وا بەردەوامبە!"];
  var TRY_AGAIN = ["هەوڵبدەرەوە!", "نزیک بوویت، دووبارە هەوڵبدە!", "خۆت مەڕەنجێنە، هەوڵبدەرەوە!"];

  var FLAG_COLORS = ["#ed2024", "#ffffff", "#278e43", "#f9af1b"];

  /* ---------------- STATE ---------------- */
  var STORAGE_LEVEL = "kurdishGame_level";
  var STORAGE_XP = "kurdishGame_xp";

  var state = {
    mode: "read",
    level: parseInt(localStorage.getItem(STORAGE_LEVEL) || "1", 10),
    xp: parseInt(localStorage.getItem(STORAGE_XP) || "0", 10),
    locked: false,
    current: null
  };

  /* ---------------- DOM ---------------- */
  var promptEl = document.getElementById("promptEl");
  var hintEl = document.getElementById("hintEl");
  var choicesEl = document.getElementById("choicesEl");
  var feedbackEl = document.getElementById("feedbackEl");
  var gameCard = document.getElementById("gameCard");
  var levelDisplay = document.getElementById("levelDisplay");
  var xpText = document.getElementById("xpText");
  var xpFill = document.getElementById("xpFill");
  var readBtn = document.getElementById("readBtn");
  var mathBtn = document.getElementById("mathBtn");
  var resetBtn = document.getElementById("resetBtn");

  function xpNeeded(level){ return 50 + (level - 1) * 15; }

  function saveProgress(){
    localStorage.setItem(STORAGE_LEVEL, String(state.level));
    localStorage.setItem(STORAGE_XP, String(state.xp));
  }

  function renderProgress(){
    levelDisplay.textContent = state.level;
    var need = xpNeeded(state.level);
    xpText.textContent = state.xp + " / " + need;
    var pct = Math.min(100, (state.xp / need) * 100);
    xpFill.style.width = pct + "%";
  }

  function addXP(amount){
    state.xp += amount;
    var need = xpNeeded(state.level);
    if (state.xp >= need){
      state.xp -= need;
      state.level += 1;
    }
    saveProgress();
    renderProgress();
  }

  /* ---------------- SHUFFLE HELPERS ---------------- */
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

  /* ---------------- READING MODE ---------------- */
  function nextReadingQuestion(){
    var pool = shuffle(WORDS);
    var correct = pool[0];
    var wrongs = pool.slice(1, 4);
    var options = shuffle([correct].concat(wrongs));

    state.current = { type: "read", answer: correct.w };

    promptEl.classList.remove("equation");
    promptEl.style.fontSize = "";
    promptEl.textContent = correct.e;
    hintEl.textContent = "ئەم وێنەیە بە کوردی چی ناوی دێت؟";

    renderChoices(options.map(function(o){ return o.w; }));
  }

  /* ---------------- MATH MODE ---------------- */
  function generateMathProblem(level){
    var a, b, op, answer, text;
    if (level <= 3){
      a = randInt(1, 8);
      b = randInt(1, 9 - a);
      op = "+";
      answer = a + b;
    } else if (level <= 6){
      a = randInt(1, 18);
      b = randInt(1, 20 - a);
      op = "+";
      answer = a + b;
    } else {
      op = Math.random() < 0.5 ? "+" : "-";
      if (op === "+"){
        a = randInt(1, 18);
        b = randInt(1, 20 - a);
        answer = a + b;
      } else {
        a = randInt(1, 20);
        b = randInt(0, a);
        answer = a - b;
      }
    }
    text = a + " " + op + " " + b + " = ؟";
    return { text: text, answer: answer };
  }

  function nextMathQuestion(){
    var problem = generateMathProblem(state.level);
    state.current = { type: "math", answer: problem.answer };

    promptEl.classList.add("equation");
    promptEl.textContent = problem.text;
    hintEl.textContent = "وەڵامی ڕاست هەڵبژێرە";

    var answers = new Set([problem.answer]);
    while (answers.size < 4){
      var delta = randInt(-5, 5);
      var candidate = problem.answer + delta;
      if (candidate >= 0 && candidate !== problem.answer) answers.add(candidate);
    }
    var options = shuffle(Array.from(answers));
    renderChoices(options.map(function(n){ return String(n); }));
  }

  /* ---------------- RENDER CHOICES ---------------- */
  function renderChoices(labels){
    choicesEl.innerHTML = "";
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    state.locked = false;

    labels.forEach(function(label, i){
      var btn = document.createElement("button");
      btn.className = "choice-btn c" + i;
      btn.textContent = label;
      btn.addEventListener("click", function(){ handleAnswer(btn, label); });
      choicesEl.appendChild(btn);
    });
  }

  function handleAnswer(btn, label){
    if (state.locked) return;
    state.locked = true;

    var correctAnswer = String(state.current.answer);
    var isCorrect = (label === correctAnswer);

    var allBtns = choicesEl.querySelectorAll(".choice-btn");
    allBtns.forEach(function(b){ b.disabled = true; });

    if (isCorrect){
      btn.classList.add("correct-flash", "glow-pulse");
      feedbackEl.textContent = PRAISE[randInt(0, PRAISE.length - 1)];
      feedbackEl.classList.add("good");
      addXP(10);
      launchConfetti();
    } else {
      btn.classList.add("wrong-flash");
      gameCard.classList.add("shake");
      feedbackEl.textContent = TRY_AGAIN[randInt(0, TRY_AGAIN.length - 1)];
      feedbackEl.classList.add("bad");
      allBtns.forEach(function(b){
        if (b.textContent === correctAnswer) b.classList.add("correct-flash");
      });
    }

    setTimeout(function(){
      gameCard.classList.remove("shake");
      if (state.mode === "read") nextReadingQuestion(); else nextMathQuestion();
    }, 1100);
  }

  /* ---------------- CONFETTI (flag colors only) ---------------- */
  function launchConfetti(){
    var count = 26;
    for (var i = 0; i < count; i++){
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = randInt(2, 98) + "vw";
      piece.style.background = FLAG_COLORS[randInt(0, FLAG_COLORS.length - 1)];
      var duration = (1.1 + Math.random() * 0.9).toFixed(2);
      piece.style.animationDuration = duration + "s";
      piece.style.opacity = "0.95";
      document.body.appendChild(piece);
      (function(el){
        setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
      })(piece);
    }
  }

  /* ---------------- MODE SWITCH ---------------- */
  function setMode(mode){
    state.mode = mode;
    readBtn.classList.toggle("active", mode === "read");
    mathBtn.classList.toggle("active", mode === "math");
    if (mode === "read") nextReadingQuestion(); else nextMathQuestion();
  }

  readBtn.addEventListener("click", function(){ setMode("read"); });
  mathBtn.addEventListener("click", function(){ setMode("math"); });

  resetBtn.addEventListener("click", function(){
    var ok = window.confirm("دڵنیایت لە ڕیسێتکردنی هەموو پێشکەوتن؟ (بۆ دایک و باوکان)");
    if (!ok) return;
    state.level = 1;
    state.xp = 0;
    saveProgress();
    renderProgress();
    if (state.mode === "read") nextReadingQuestion(); else nextMathQuestion();
  });

  /* ---------------- INIT ---------------- */
  renderProgress();
  nextReadingQuestion();

})();
</script>
</body>
</html>
