<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری پەروەردەیی گشتگیر بۆ منداڵان</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #278e43;
            --danger: #ed2024;
            --warning: #f9af1b;
            --blue: #2196F3;
            --purple: #9C27B0;
            --text-main: #333333;
        }

        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main);
            text-align: center; 
            margin: 0; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 700px;
            background: var(--card-bg); padding: 15px 20px;
            border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px;
        }

        .flag {
            width: 50px; height: 33px; display: flex; flex-direction: column;
            border-radius: 4px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .flag .red { background: #ed2024; flex: 1; }
        .flag .white { background: #ffffff; flex: 1; display: flex; justify-content: center; align-items: center; position: relative;}
        .flag .white::after { content: '☀️'; position: absolute; font-size: 14px; color: #f9af1b; }
        .flag .green { background: #278e43; flex: 1; }

        .stats { font-size: 18px; font-weight: bold; }
        .stats span { color: var(--primary); margin: 0 5px; font-size: 22px;}

        .game-board {
            background: var(--card-bg); width: 100%; max-width: 700px;
            padding: 25px 20px; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); position: relative; overflow: hidden;
        }

        .categories {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px;
        }
        
        .mode-btn {
            background: #eee; border: none; padding: 10px 15px;
            border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold;
            transition: 0.3s; color: #555;
        }
        .mode-btn:hover { background: #ddd; }
        .mode-btn.active-kurdish { background: var(--primary); color: white; }
        .mode-btn.active-religion { background: var(--warning); color: white; }
        .mode-btn.active-science { background: var(--blue); color: white; }
        .mode-btn.active-math { background: var(--danger); color: white; }
        .mode-btn.active-mixed { background: var(--purple); color: white; }

        #question-area {
            font-size: 28px; margin: 20px 0; min-height: 80px;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #222; line-height: 1.5;
        }

        #math-area {
            font-size: 60px; font-weight: bold; direction: ltr; color: var(--danger);
        }

        #options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .btn { 
            background-color: #f8f9fa; color: #333; border: 2px solid #ddd; 
            padding: 15px 10px; font-size: 20px; font-weight: bold;
            border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { border-color: var(--primary); background-color: #f0fdf4; }
        .btn:active { transform: scale(0.97); }

        #message { font-size: 22px; font-weight: bold; margin-top: 20px; min-height: 35px; }

        .progress-container { width: 100%; background: #eee; border-radius: 10px; margin-top: 20px; height: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--warning); width: 0%; transition: width 0.5s ease; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.3s; }
        .glow { box-shadow: 0 0 20px 10px rgba(39,142,67,0.3) !important; transition: 0.3s; }
        .confetti { position: absolute; width: 10px; height: 10px; opacity: 0; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(200px) rotate(360deg); opacity: 0; } }
        
        @media(max-width: 480px) {
            #options { grid-template-columns: 1fr; }
            #question-area { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="flag">
            <div class="red"></div><div class="white"></div><div class="green"></div>
        </div>
        <div class="stats">
            ئاست: <span id="levelDisplay">١</span> | خاڵ: <span id="xpDisplay">٠</span>
        </div>
    </div>

    <div class="game-board" id="board">
        <div class="categories">
            <button class="mode-btn" id="btnMixed" onclick="setMode('mixed')">🔀 تێکەڵ</button>
            <button class="mode-btn" id="btnKurdish" onclick="setMode('kurdish')">📖 زمانی کوردی</button>
            <button class="mode-btn" id="btnReligion" onclick="setMode('religion')">🕌 ئاینی</button>
            <button class="mode-btn" id="btnScience" onclick="setMode('science')">🔬 زانست و پەروەردە</button>
            <button class="mode-btn" id="btnMath" onclick="setMode('math')">🔢 بیرکاری</button>
        </div>

        <div id="question-area">پرسیار لێرە دەردەکەوێت</div>
        <div id="options"></div>
        <p id="message"></p>
        
        <div class="progress-container">
            <div class="progress-bar" id="xpBar"></div>
        </div>
    </div>

    <script>
        // گۆڕینی ژمارەکان بۆ ژمارەی کوردی
        function toKurdishNum(num) {
            const kurdishDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return num.toString().replace(/[0-9]/g, w => kurdishDigits[w]);
        }

        // داتابەیسی پرسیارەکان (دەتوانیت تا ٢٠٠٠ پرسیار و زیاتریش لێرە زیاد بکەیت)
        const database = {
            kurdish: [
                { q: "پێچەوانەی وشەی (گەورە) چییە؟", options: ["بچووک", "درێژ", "کورت", "قەڵەو"], a: "بچووک" },
                { q: "هاوواتای وشەی (خێرا) چییە؟", options: ["توند", "خاو", "بەرەوڕوو", "گورج"], a: "گورج" },
                { q: "پایتەختی کوردستان کوێیە؟", options: ["سلێمانی", "هەولێر", "دهۆک", "کەرکوک"], a: "هەولێر" },
                { q: "کام لەم پیتانە بزوێنە؟", options: ["ب", "د", "ۆ", "س"], a: "ۆ" },
                { q: "ناوی ئەم ئاژەڵە چییە کە شیری هەیە؟", options: ["مریشک", "مانگا", "قاز", "چۆلەکە"], a: "مانگا" },
                { q: "کام وشە ناوی ڕووەکە؟", options: ["بەرد", "ئاو", "درەخت", "خاک"], a: "درەخت" }
            ],
            religion: [
                { q: "یەکەم پێغەمبەر کێ بوو؟", options: ["نوح (د.خ)", "ئادەم (د.خ)", "عیسا (د.خ)", "موسا (د.خ)"], a: "ئادەم (د.خ)" },
                { q: "قورئانی پیرۆز بە چ زمانێک دابەزیوە؟", options: ["کوردی", "فارسی", "عەرەبی", "ئینگلیزی"], a: "عەرەبی" },
                { q: "ڕۆژانە چەند فەرزە نوێژ دەکەین؟", options: ["٣ فەرزە", "٤ فەرزە", "٥ فەرزە", "٦ فەرزە"], a: "٥ فەرزە" },
                { q: "دوایین پێغەمبەر کێیە؟", options: ["عیسا (د.خ)", "موسا (د.خ)", "ئیبراهیم (د.خ)", "محەمەد (د.خ)"], a: "محەمەد (د.خ)" },
                { q: "مانگی ڕۆژووگرتن ناوی چییە؟", options: ["شەعبان", "ڕەمەزان", "موهەڕەم", "سەفەر"], a: "ڕەمەزان" }
            ],
            science: [
                { q: "ئێمە بە چی هەناسە دەدەین؟", options: ["سییەکان", "دڵ", "گەدە", "مێشک"], a: "سییەکان" },
                { q: "ڕەنگی ئاسمان لە ڕۆژدا چۆنە؟", options: ["سوور", "شین", "سەوز", "زەرد"], a: "شین" },
                { q: "ئاو لە چ پلەیەکدا دەیبەستێت (دەبێتە سەهۆڵ)؟", options: ["١٠٠ پلە", "٥٠ پلە", "٠ پلە", "١٠ پلە"], a: "٠ پلە" },
                { q: "کام هەسارە بە هەسارەی سوور ناسراوە؟", options: ["زەوی", "مەریخ", "عەتارید", "موشتەری"], a: "مەریخ" },
                { q: "کاتێک دەپژمین پێویستە چی بڵێین؟", options: ["سوپاس", "الحمدلله", "سڵاو", "خوات لەگەڵ"], a: "الحمدلله" }
            ]
        };

        // مۆلیدەی پرسیاری بیرکاری بێسنوور
        function generateMath() {
            let num1, num2, sign, answer;
            let op = Math.random();
            
            if (op < 0.5 || level <= 2) {
                // کۆکردنەوە
                num1 = Math.floor(Math.random() * (level * 5)) + 1;
                num2 = Math.floor(Math.random() * (level * 5)) + 1;
                sign = '+';
                answer = num1 + num2;
            } else if (op < 0.8) {
                // لێدەرکردن (هەمیشە گەورەتر کەمتی بچووکتر)
                num1 = Math.floor(Math.random() * (level * 5)) + 5;
                num2 = Math.floor(Math.random() * num1) + 1;
                sign = '-';
                answer = num1 - num2;
            } else {
                // لێکدان (بۆ ئاستە بەرزەکان)
                num1 = Math.floor(Math.random() * 9) + 1;
                num2 = Math.floor(Math.random() * 5) + 1;
                sign = '×';
                answer = num1 * num2;
            }

            let qStr = `<span id="math-area">${toKurdishNum(num1)} ${sign} ${toKurdishNum(num2)}</span>`;
            
            let options = [answer];
            while (options.length < 4) {
                let fake = answer + (Math.floor(Math.random() * 10) - 5);
                if (fake !== answer && fake >= 0 && !options.includes(fake)) {
                    options.push(fake);
                }
            }
            
            // گۆڕینی هەموو هەڵبژاردەکان بۆ ژمارەی کوردی
            let kurdishOptions = options.map(opt => toKurdishNum(opt));

            return { q: qStr, options: kurdishOptions, a: toKurdishNum(answer) };
        }

        let currentMode = 'mixed';
        let level = parseInt(localStorage.getItem('kurdEduLevel')) || 1;
        let xp = parseInt(localStorage.getItem('kurdEduXP')) || 0;
        let xpNeeded = level * 100;
        let currentAnswer = '';

        function updateUI() {
            document.getElementById('levelDisplay').innerText = toKurdishNum(level);
            document.getElementById('xpDisplay').innerText = toKurdishNum(xp);
            let xpPercent = (xp / xpNeeded) * 100;
            document.getElementById('xpBar').style.width = xpPercent + '%';
        }

        function saveData() {
            localStorage.setItem('kurdEduLevel', level);
            localStorage.setItem('kurdEduXP', xp);
            xpNeeded = level * 100;
            updateUI();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.className = 'mode-btn');
            document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add(`active-${mode}`);
            document.getElementById('message').innerText = '';
            loadQuestion();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQuestion() {
            const qArea = document.getElementById('question-area');
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            let questionObj;

            if (currentMode === 'math') {
                questionObj = generateMath();
            } else {
                let category = currentMode;
                if (currentMode === 'mixed') {
                    const cats = ['kurdish', 'religion', 'science', 'math'];
                    category = cats[Math.floor(Math.random() * cats.length)];
                }
                
                if (category === 'math') {
                    questionObj = generateMath();
                } else {
                    let catArray = database[category];
                    questionObj = catArray[Math.floor(Math.random() * catArray.length)];
                }
            }

            currentAnswer = questionObj.a;
            qArea.innerHTML = questionObj.q;

            let shuffledOptions = shuffleArray([...questionObj.options]);
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement) {
            const msg = document.getElementById('message');
            const board = document.getElementById('board');
            const allBtns = document.querySelectorAll('.btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === currentAnswer) {
                msg.innerText = 'ئافەرین پاڵەوان! 👏';
                msg.style.color = 'var(--primary)';
                board.classList.add('glow');
                btnElement.style.backgroundColor = 'var(--primary)';
                btnElement.style.color = 'white';
                
                createConfetti();

                xp += 10;
                if (xp >= xpNeeded) {
                    level++;
                    xp = 0;
                    msg.innerText = `ئافەرین! چوویتە ئاستی ${toKurdishNum(level)} 🎉`;
                }
                saveData();

                setTimeout(() => { 
                    board.classList.remove('glow');
                    msg.innerText = ''; 
                    loadQuestion(); 
                }, 1500);

            } else {
                msg.innerText = 'هەڵەیە، دووبارە هەوڵ بدەرەوە!';
                msg.style.color = 'var(--danger)';
                board.classList.add('shake');
                btnElement.style.backgroundColor = 'var(--danger)';
                btnElement.style.color = 'white';
                
                setTimeout(() => { 
                    board.classList.remove('shake'); 
                    msg.innerText = '';
                    btnElement.style.backgroundColor = '';
                    btnElement.style.color = '';
                    allBtns.forEach(b => b.disabled = false);
                }, 1200);
            }
        }

        function createConfetti() {
            const board = document.getElementById('board');
            const colors = ['#ed2024', '#278e43', '#f9af1b', '#2196F3'];
            for (let i = 0; i < 30; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '10%';
                conf.style.animation = `fall ${Math.random() * 1 + 1}s linear`;
                board.appendChild(conf);
                setTimeout(() => { conf.remove(); }, 2000);
            }
        }

        // دانانی مۆدی سەرەتایی
        setMode('mixed');
        updateUI();
    </script>
</body>
</html>
