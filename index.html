<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ئەکادیمیای زیرەک | یارییەکی فێربوون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ZIRAK ACADEMY — design tokens
   sky -> grape gradient world, sun-yellow accent, owl mascot 🦉
   ============================================================ */
:root{
  --sky-top:#57C2F5;
  --sky-bottom:#8D6BEE;
  --sun:#FFC93C;
  --sun-dark:#F2A200;
  --grass:#4CD37B;
  --grass-dark:#2FAE5E;
  --coral:#FF5D7A;
  --coral-dark:#E4425F;
  --grape:#9B5DE5;
  --ink:#2B2447;
  --ink-soft:#5B5478;
  --card:#FFFFFF;
  --cream:#FFF6E5;
  --shadow: 0 10px 0 rgba(43,36,71,0.12);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Vazirmatn', Tahoma, sans-serif;
  background:
    radial-gradient(circle at 15% 8%, rgba(255,255,255,0.35) 0, transparent 40%),
    radial-gradient(circle at 85% 18%, rgba(255,255,255,0.25) 0, transparent 35%),
    linear-gradient(160deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  min-height:100vh;
  color:var(--ink);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  padding-bottom:calc(12px + var(--safe-bottom));
}
.screen{ display:none; flex-direction:column; flex:1; padding:18px 16px; animation:fadeIn .35s ease; }
.screen.active{ display:flex; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* clouds decoration */
.cloud{ position:fixed; opacity:.55; pointer-events:none; filter:drop-shadow(0 4px 0 rgba(255,255,255,.2)); z-index:0; }
.cloud svg{ width:100%; height:100%; }

/* ---------- Top bar (stats) ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-bottom:14px; position:relative; z-index:2;
}
.stat-pill{
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.92);
  border-radius:999px; padding:7px 12px;
  box-shadow:var(--shadow);
  font-weight:700; font-size:14px; color:var(--ink);
  white-space:nowrap;
}
.stat-pill .icon{ font-size:16px; }
.streak-pill.hot{ background:linear-gradient(135deg,#FFE1A8,#FFC93C); }

/* ---------- Level / XP bar ---------- */
.xp-wrap{ margin-bottom:16px; position:relative; z-index:2; }
.xp-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.level-badge{
  background:var(--grape); color:#fff; font-weight:800; font-size:13px;
  border-radius:999px; padding:5px 12px; box-shadow:0 4px 0 #7238B8;
}
.xp-label{ font-size:12px; font-weight:700; color:rgba(255,255,255,.9); }
.xp-track{
  height:16px; background:rgba(255,255,255,.35); border-radius:999px;
  overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.15);
}
.xp-fill{
  height:100%; border-radius:999px;
  background:linear-gradient(90deg, var(--sun), var(--sun-dark));
  width:0%; transition:width .6s cubic-bezier(.22,1.4,.4,1);
  position:relative;
}
.xp-fill::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.5), transparent 60%);
}

/* ---------- Home / mascot ---------- */
.mascot-hero{ text-align:center; margin:6px 0 18px; position:relative; z-index:2; }
.mascot-emoji{ font-size:88px; display:inline-block; animation:bob 3s ease-in-out infinite; filter:drop-shadow(0 10px 8px rgba(0,0,0,.15)); }
@keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-10px) rotate(2deg);} }
.hero-title{ color:#fff; font-weight:900; font-size:26px; margin:10px 0 2px; text-shadow:0 3px 0 rgba(0,0,0,.12); }
.hero-sub{ color:rgba(255,255,255,.9); font-weight:600; font-size:14px; margin:0; }

/* ---------- Category grid ---------- */
.cat-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  position:relative; z-index:2; margin-bottom:10px;
}
.cat-card{
  background:var(--card); border:none; border-radius:var(--radius-md);
  padding:16px 10px 14px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
  font-family:inherit;
}
.cat-card:active{ transform:translateY(6px); box-shadow:0 4px 0 rgba(43,36,71,0.12); }
.cat-card .cat-emoji{ font-size:34px; }
.cat-card .cat-name{ font-weight:800; font-size:15px; color:var(--ink); }
.cat-card .cat-progress{ font-size:11px; color:var(--ink-soft); font-weight:600; }
.cat-card.mixed{ grid-column:1/-1; flex-direction:row; justify-content:center; gap:12px; background:linear-gradient(135deg,#FFE1A8,#FFC93C); }
.cat-card.mixed .cat-emoji{ font-size:30px; }

/* ---------- Buttons ---------- */
.btn{
  border:none; border-radius:999px; font-family:inherit; font-weight:800;
  font-size:16px; padding:14px 22px; cursor:pointer; width:100%;
  transition:transform .1s ease, box-shadow .1s ease; color:#fff;
}
.btn:active{ transform:translateY(5px); }
.btn-primary{ background:var(--grass); box-shadow:0 5px 0 var(--grass-dark); }
.btn-primary:active{ box-shadow:0 1px 0 var(--grass-dark); }
.btn-secondary{ background:rgba(255,255,255,.9); color:var(--ink); box-shadow:0 5px 0 rgba(43,36,71,0.18); }
.btn-secondary:active{ box-shadow:0 1px 0 rgba(43,36,71,0.18); }
.btn-sun{ background:var(--sun); color:var(--ink); box-shadow:0 5px 0 var(--sun-dark); }
.btn-sun:active{ box-shadow:0 1px 0 var(--sun-dark); }
.btn:disabled{ opacity:.5; pointer-events:none; }

/* ---------- Quiz screen ---------- */
.quiz-header{ display:flex; align-items:center; gap:10px; margin-bottom:16px; position:relative; z-index:2; }
.back-btn{
  background:rgba(255,255,255,.92); border:none; border-radius:50%;
  width:38px; height:38px; font-size:18px; cursor:pointer; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.progress-track{ flex:1; height:14px; background:rgba(255,255,255,.35); border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,.12); }
.progress-fill{ height:100%; background:linear-gradient(90deg,#fff,#FFE9B8); border-radius:999px; transition:width .4s ease; }
.hearts{ display:flex; gap:2px; font-size:16px; flex-shrink:0; }

.question-card{
  background:var(--card); border-radius:var(--radius-lg); padding:22px 18px;
  box-shadow:var(--shadow); margin-bottom:18px; position:relative; z-index:2;
  min-height:120px; display:flex; flex-direction:column; justify-content:center;
}
.q-tag{ font-size:12px; font-weight:800; color:var(--grape); background:#F1E5FF; align-self:flex-start; padding:4px 10px; border-radius:999px; margin-bottom:10px; }
.q-text{ font-size:20px; font-weight:800; line-height:1.55; color:var(--ink); }
.q-emoji-big{ font-size:46px; text-align:center; margin-bottom:6px; }

.options-grid{ display:flex; flex-direction:column; gap:10px; position:relative; z-index:2; margin-bottom:16px; }
.option-btn{
  background:var(--card); border:3px solid #ECE9F5; border-radius:var(--radius-md);
  padding:14px 16px; font-family:inherit; font-size:17px; font-weight:700; color:var(--ink);
  text-align:right; cursor:pointer; box-shadow:0 4px 0 #ECE9F5;
  transition:transform .08s ease, box-shadow .08s ease, background .15s ease, border-color .15s ease;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.option-btn:active{ transform:translateY(3px); }
.option-btn .opt-letter{
  background:#F3F1FA; color:var(--ink-soft); font-weight:800; font-size:13px;
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.option-btn.correct{ background:#E4FBEC; border-color:var(--grass); box-shadow:0 4px 0 var(--grass-dark); }
.option-btn.correct .opt-letter{ background:var(--grass); color:#fff; }
.option-btn.wrong{ background:#FFE9EC; border-color:var(--coral); box-shadow:0 4px 0 var(--coral-dark); }
.option-btn.wrong .opt-letter{ background:var(--coral); color:#fff; }
.option-btn.disabled{ pointer-events:none; opacity:.55; }
.option-btn.disabled.correct, .option-btn.disabled.wrong{ opacity:1; }

.feedback-bar{
  position:relative; z-index:2; border-radius:var(--radius-md); padding:14px 16px;
  display:none; align-items:center; gap:10px; margin-bottom:10px; font-weight:800; font-size:15px;
}
.feedback-bar.show{ display:flex; animation:slideUp .3s ease; }
@keyframes slideUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
.feedback-bar.good{ background:#E4FBEC; color:var(--grass-dark); }
.feedback-bar.bad{ background:#FFE9EC; color:var(--coral-dark); }
.feedback-emoji{ font-size:26px; }
.feedback-text{ flex:1; }
.feedback-text small{ display:block; font-weight:600; font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

/* shake on wrong */
.shake{ animation:shake .45s; }
@keyframes shake{
  10%,90%{ transform:translateX(-2px); }
  20%,80%{ transform:translateX(4px); }
  30%,50%,70%{ transform:translateX(-8px); }
  40%,60%{ transform:translateX(8px); }
}

/* ---------- Modals ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(43,36,71,.55); z-index:50;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.show{ display:flex; }
.modal-card{
  background:var(--card); border-radius:28px; padding:30px 24px 26px; text-align:center;
  max-width:360px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,.25);
  animation:popIn .4s cubic-bezier(.2,1.4,.4,1);
}
@keyframes popIn{ from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);} }
.modal-emoji{ font-size:64px; margin-bottom:6px; }
.modal-title{ font-size:24px; font-weight:900; margin:4px 0 6px; color:var(--ink); }
.modal-sub{ font-size:14.5px; color:var(--ink-soft); font-weight:600; margin-bottom:18px; line-height:1.6; }
.modal-stats{ display:flex; gap:10px; justify-content:center; margin-bottom:20px; }
.modal-stat{ background:var(--cream); border-radius:16px; padding:10px 16px; min-width:78px; }
.modal-stat .n{ font-weight:900; font-size:20px; color:var(--ink); }
.modal-stat .l{ font-size:11px; font-weight:700; color:var(--ink-soft); }

/* confetti */
.confetti-piece{
  position:fixed; top:-20px; width:10px; height:16px; z-index:60; pointer-events:none;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  to{ transform:translateY(110vh) rotate(540deg); opacity:.9; }
}

footer.made-by{ text-align:center; color:rgba(255,255,255,.75); font-size:11px; font-weight:600; padding:10px 0 4px; position:relative; z-index:2; }
</style>
</head>
<body>

<!-- decorative clouds -->
<div class="cloud" style="top:6%; right:-30px; width:120px; height:60px;"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="35" fill="white"/><ellipse cx="110" cy="45" rx="45" ry="40" fill="white"/><ellipse cx="150" cy="65" rx="40" ry="28" fill="white"/></svg></div>
<div class="cloud" style="top:22%; left:-40px; width:100px; height:50px;"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="60" rx="55" ry="35" fill="white"/><ellipse cx="110" cy="45" rx="45" ry="40" fill="white"/><ellipse cx="150" cy="65" rx="40" ry="28" fill="white"/></svg></div>

  <section class="screen" id="screen-quiz">

<!-- ======================= LEVEL UP MODAL ======================= -->
<div class="modal-overlay" id="modal-levelup">

<script>
/* ================================================================
   ZIRAK ACADEMY — game engine
   ================================================================ */

/* ---------------------------------------------------------------
   0. UTILITIES
   --------------------------------------------------------------- */
const EASTERN_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toEastern(n){ return String(n).replace(/[0-9]/g, d => EASTERN_DIGITS[d]); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

/* Tiny WebAudio SFX (no external files needed) */
const AudioFX = (() => {
  let ctx;
  function getCtx(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function tone(freq, dur, type='sine', vol=0.18, delay=0){
    try{
      const c = getCtx();
      const o = c.createOscillator(); const g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(c.destination);
      const t0 = c.currentTime + delay;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }catch(e){/* audio not available */}
  }
  return {
    correct(){ tone(523.25,.12,'sine',.2,0); tone(659.25,.12,'sine',.2,.09); tone(783.99,.18,'sine',.22,.18); },
    wrong(){ tone(220,.18,'sawtooth',.15,0); tone(160,.22,'sawtooth',.15,.1); },
    levelup(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.16,'triangle',.2,i*.11)); },
    click(){ tone(880,.05,'sine',.08,0); }
  };
})();

function confettiBurst(n=60){
  const colors = ['#FFC93C','#FF5D7A','#4CD37B','#57C2F5','#9B5DE5'];
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100 + 'vw';
    el.style.background = pick(colors);
    el.style.animationDuration = (2 + Math.random()*1.5) + 's';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    el.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3600);
  }
}

/* ---------------------------------------------------------------
   1. QUESTION DATABASE
   Each entry: { q: "...", o: [4 options], a: correctIndex, t: tier(1-5), e: emoji(optional) }
   tier 1 -> levels 1-20 | tier 2 -> 21-40 | tier 3 -> 41-60 | tier 4 -> 61-80 | tier 5 -> 81-100+

   ⬇️⬇️⬇️  PASTE YOUR THOUSANDS OF NEW QUESTIONS INSIDE THE MATCHING
   ARRAY BELOW, FOLLOWING THE SAME {q,o,a,t,e} FORMAT.  ⬇️⬇️⬇️
   --------------------------------------------------------------- */
const QDB = {

  /* ============================= ENGLISH ============================= */
  english: [
    // ---- tier 1 (levels 1-20): letters, colors, basic words ----
    {q:'کامیان پیتی یەکەمی ئەلفوبێی ئینگلیزییە؟', o:['A','B','C','D'], a:0, t:1, e:'🔤'},
    {q:'وشەی "Dog" واتای چیە؟', o:['پشیلە','سەگ','مانگا','مریشک'], a:1, t:1, e:'🐕'},
    {q:'وشەی "Sun" واتای چیە؟', o:['مانگ','ئەستێرە','خۆر','هەور'], a:2, t:1, e:'☀️'},

/* ---------------------------------------------------------------
   2. MATH ENGINE — procedural generation (millions of variants)
   tier scales automatically with the player's level, not hardcoded.
   --------------------------------------------------------------- */
function generateMathQuestion(level){
  const tier = Math.min(5, Math.ceil(level/20)); // 1..5
  let a,b,op,answer,text;

  function distractors(correct, spread){
    const set = new Set([correct]);
    while(set.size < 4){
      const d = correct + randInt(-spread, spread);
      if(d !== correct && d >= 0 && !set.has(d)) set.add(d);
    }
    return shuffle([...set]);
  }

  if(tier === 1){ // single digit +/-
    a = randInt(1,10); b = randInt(1,10);
    op = pick(['+','-']);
    if(op === '-' && b > a) [a,b] = [b,a];
    answer = op === '+' ? a+b : a-b;
    text = `${toEastern(a)} ${op} ${toEastern(b)} = ؟`;
    return {q:text, o:distractors(answer,4).map(toEastern), a:0, correct:answer, opRaw:distractors(answer,4)};
  }
  if(tier === 2){ // up to 20, intro multiplication tables 1-5
    op = pick(['+','-','×']);
    if(op === '×'){ a = randInt(1,5); b = randInt(1,5); answer = a*b; }
    else { a = randInt(5,20); b = randInt(1,20); if(op==='-' && b>a) [a,b]=[b,a]; answer = op==='+'? a+b : a-b; }
    text = `${toEastern(a)} ${op} ${toEastern(b)} = ؟`;
    const opts = distractors(answer, 5);
    return {q:text, o:opts.map(toEastern), correct:answer};
  }
  if(tier === 3){ // multiplication tables up to 10, simple division
    op = pick(['×','÷']);
    if(op === '×'){ a = randInt(2,10); b = randInt(2,10); answer = a*b; text = `${toEastern(a)} × ${toEastern(b)} = ؟`; }
    else { b = randInt(2,10); answer = randInt(2,10); a = b*answer; text = `${toEastern(a)} ÷ ${toEastern(b)} = ؟`; }
    const opts = distractors(answer, 6);
    return {q:text, o:opts.map(toEastern), correct:answer};
  }
  if(tier === 4){ // two/three-digit operations
    op = pick(['+','-','×']);
    if(op === '×'){ a = randInt(10,25); b = randInt(2,9); answer = a*b; }
    else { a = randInt(50,300); b = randInt(10,200); if(op==='-' && b>a) [a,b]=[b,a]; answer = op==='+'? a+b : a-b; }
    text = `${toEastern(a)} ${op} ${toEastern(b)} = ؟`;
    const opts = distractors(answer, 10);
    return {q:text, o:opts.map(toEastern), correct:answer};
  }
  // tier 5: percentages, fractions, simple algebra
  const kind = pick(['percent','fraction','algebra']);
  if(kind === 'percent'){
    const base = pick([10,20,25,50,100,200,400]);
    const pct = pick([10,20,25,50]);
    answer = base * pct/100;
    text = `${toEastern(pct)}% لە ${toEastern(base)} دەکاتە چەند؟`;
    const opts = distractors(answer, Math.max(4, Math.round(answer*0.4)));
    return {q:text, o:opts.map(toEastern), correct:answer};
  }
  if(kind === 'fraction'){
    const denom = pick([2,4,5,10]);
    const whole = randInt(1,5)*denom;
    answer = whole/denom;
    text = `١/${toEastern(denom)} لە ${toEastern(whole)} دەکاتە چەند؟`;
    const opts = distractors(answer, 4);
    return {q:text, o:opts.map(toEastern), correct:answer};
  }
  // simple algebra: x + a = b
  a = randInt(2,20); const x = randInt(1,20); b = a + x;
  answer = x;
  text = `ئەگەر x + ${toEastern(a)} = ${toEastern(b)}, ئەوا x = ؟`;
  const opts = distractors(answer, 5);
  return {q:text, o:opts.map(toEastern), correct:answer};
}

function buildMathOption(level){
  const raw = generateMathQuestion(level);
  const correctVal = raw.correct;
  const optsNum = raw.o.map(s => {
    // convert back eastern->western for index matching safety
    let w = s; EASTERN_DIGITS.forEach((ed,i)=>{ w = w.split(ed).join(i); });
    return parseInt(w,10);
  });
  const correctIndex = optsNum.findIndex(n => n === correctVal);
  return { q: raw.q, o: raw.o, a: correctIndex, t: Math.min(5, Math.ceil(level/20)), e:'🔢' };
}

/* ---------------------------------------------------------------
   3. STATE (in-memory only — this file is viewed inside Claude's
   sandboxed artifact preview, which does not support localStorage.
   If you host this file on your own server/browser, you can safely
   wrap PlayerState load/save with localStorage.getItem/setItem.)
   --------------------------------------------------------------- */
const PlayerState = {
  level: 1,
  xp: 0,
  gems: 0,
  streak: 0,
  bestStreak: 0,
  usedPools: {}, // { "english-1": [remaining shuffled indices] }
};

function xpNeededFor(level){ return 80 + (level-1)*15; }

/* Session (current quiz run) */
let Session = {
  category: null,
  queue: [],       // array of question objects for this run
  index: 0,
  correctCount: 0,
  xpEarned: 0,
  lives: 3,
  answered: false,
};

/* ---------------------------------------------------------------
   4. NO-REPEAT QUESTION POOL LOGIC
   --------------------------------------------------------------- */
function tierForLevel(level){ return Math.min(5, Math.ceil(level/20)); }

function getPoolKey(cat, tier){ return `${cat}-${tier}`; }

function drawQuestions(cat, count){
  const tier = tierForLevel(PlayerState.level);
  const results = [];

  if(cat === 'math'){
    for(let i=0;i<count;i++) results.push(buildMathOption(PlayerState.level));
    return results;
  }

  if(cat === 'mixed'){
    const cats = ['english','kurdish','science','religion','math'];
    for(let i=0;i<count;i++){
      const c = pick(cats);
      if(c === 'math'){ results.push(buildMathOption(PlayerState.level)); }
      else { results.push(drawFromPool(c, tier, 1)[0]); }
    }
    return results;
  }

  return drawFromPool(cat, tier, count);
}

function drawFromPool(cat, tier, count){
  const pool = QDB[cat].filter(q => q.t === tier);
  const key = getPoolKey(cat, tier);
  if(!PlayerState.usedPools[key] || PlayerState.usedPools[key].length === 0){
    PlayerState.usedPools[key] = shuffle(pool.map((_,i)=>i));
  }
  const out = [];
  for(let i=0;i<count;i++){
    if(PlayerState.usedPools[key].length === 0){
      PlayerState.usedPools[key] = shuffle(pool.map((_,i)=>i));
    }
    const idx = PlayerState.usedPools[key].pop();
    out.push(pool[idx]);
  }
  return out;
}

/* ---------------------------------------------------------------
   5. UI RENDERING
   --------------------------------------------------------------- */
const CAT_LABELS = {
  english:'ئینگلیزی', math:'بیرکاری', kurdish:'زمانی کوردی', science:'زانست', religion:'ئایینی', mixed:'تێکەڵ'
};
const QUESTIONS_PER_ROUND = 8;

function el(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el(id).classList.add('active');
}

function refreshHomeUI(){
  el('home-level').textContent = toEastern(PlayerState.level);
  el('home-xp').textContent = toEastern(PlayerState.xp);
  const need = xpNeededFor(PlayerState.level);
  el('home-xp-need').textContent = toEastern(need);
  el('home-xp-fill').style.width = Math.min(100,(PlayerState.xp/need)*100) + '%';
  el('home-gems').textContent = toEastern(PlayerState.gems);
  el('home-streak').textContent = toEastern(PlayerState.streak);
  el('home-streak-pill').classList.toggle('hot', PlayerState.streak >= 3);

  ['english','kurdish','science','religion'].forEach(cat=>{
    const tier = tierForLevel(PlayerState.level);
    const total = QDB[cat].filter(q=>q.t===tier).length;
    el('prog-'+cat).textContent = `پۆلی ${toEastern(tier)} • ${toEastern(total)} پرسیار`;
  });
}

function startCategory(cat){
  AudioFX.click();
  Session = { category:cat, queue:drawQuestions(cat, QUESTIONS_PER_ROUND), index:0, correctCount:0, xpEarned:0, lives:3, answered:false };
  el('quiz-cat-tag').textContent = CAT_LABELS[cat] + ' • ' + 'ئاست ' + toEastern(PlayerState.level);
  renderHearts();
  showScreen('screen-quiz');
  renderQuestion();
}

function renderHearts(){
  el('quiz-hearts').textContent = '❤️'.repeat(Session.lives) + '🖤'.repeat(3-Session.lives);
}

function renderQuestion(){
  Session.answered = false;
  const q = Session.queue[Session.index];
  el('quiz-progress-fill').style.width = ((Session.index)/Session.queue.length*100) + '%';
  el('quiz-emoji').textContent = q.e || '';
  el('quiz-question').textContent = q.q;
  el('quiz-next').style.display = 'none';
  el('quiz-feedback').classList.remove('show');

  const optWrap = el('quiz-options');
  optWrap.innerHTML = '';
  const letters = ['أ','ب','ج','د'];
  q.o.forEach((optText, i)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span>${optText}</span><span class="opt-letter">${letters[i]}</span>`;
    btn.addEventListener('click', ()=> handleAnswer(i, btn, q));
    optWrap.appendChild(btn);
  });
}

function handleAnswer(chosenIndex, btnEl, q){
  if(Session.answered) return;
  Session.answered = true;
  const correct = chosenIndex === q.a;
  const allBtns = document.querySelectorAll('#quiz-options .option-btn');
  allBtns.forEach(b => b.classList.add('disabled'));

  if(correct){
    btnEl.classList.add('correct');
    AudioFX.correct();
    Session.correctCount++;
    PlayerState.streak++;
    PlayerState.bestStreak = Math.max(PlayerState.bestStreak, PlayerState.streak);
    const gained = 10 + Math.min(15, PlayerState.streak*2);
    Session.xpEarned += gained;
    PlayerState.gems += 1;
    showFeedback(true, `+${toEastern(gained)} XP`);
  } else {
    btnEl.classList.add('wrong');
    allBtns[q.a].classList.add('correct');
    AudioFX.wrong();
    document.querySelector('.question-card').classList.add('shake');
    setTimeout(()=>document.querySelector('.question-card').classList.remove('shake'), 450);
    PlayerState.streak = 0;
    Session.lives--;
    renderHearts();
    showFeedback(false, 'وەڵامی ڕاست دیاریکراوە بە سەوز');
  }
  refreshHomeUI();
  el('quiz-next').style.display = 'block';
  el('quiz-next').textContent = (Session.lives <= 0) ? 'بینینی ئەنجام' : (Session.index+1 >= Session.queue.length ? 'کۆتایی هێنان' : 'بەردەوامبوون');
}

function showFeedback(good, sub){
  const bar = el('quiz-feedback');
  bar.className = 'feedback-bar show ' + (good ? 'good' : 'bad');
  el('feedback-emoji').textContent = good ? pick(['🎉','⭐','🔥','👏']) : '💡';
  el('feedback-title').textContent = good ? pick(['وەڵامی ڕاست!','گەورەیت!','زۆر باشە!','ئاماژەت ڕاستە!']) : 'هیچی خراپ نییە، دووبارە هەوڵبدەوە!';
  el('feedback-sub').textContent = sub;
}

function nextQuestion(){
  AudioFX.click();
  if(Session.lives <= 0 || Session.index+1 >= Session.queue.length){
    finishSession();
    return;
  }
  Session.index++;
  renderQuestion();
}

function finishSession(){
  // apply XP & handle level ups
  let leveledUp = false;
  let newLevel = PlayerState.level;
  PlayerState.xp += Session.xpEarned;
  while(PlayerState.xp >= xpNeededFor(newLevel)){
    PlayerState.xp -= xpNeededFor(newLevel);
    newLevel++;
    leveledUp = true;
  }
  PlayerState.level = newLevel;
  refreshHomeUI();

  const pct = Session.queue.length ? Math.round(Session.correctCount/Session.queue.length*100) : 0;
  el('complete-emoji').textContent = pct >= 80 ? '🏆' : pct >= 50 ? '🎉' : '💪';
  el('complete-title').textContent = pct >= 80 ? 'ئەستێرەی ڕاستەقینەیت!' : pct >= 50 ? 'کارێکی باشت کرد!' : 'بەردەوام بە هەوڵبدە!';
  el('complete-sub').textContent = `تۆ ${toEastern(Session.correctCount)} لە ${toEastern(Session.queue.length)} پرسیارت وەڵام دایەوە بە ڕاستی.`;
  el('complete-correct').textContent = toEastern(Session.correctCount);
  el('complete-xp').textContent = toEastern(Session.xpEarned);
  el('complete-streak').textContent = toEastern(PlayerState.bestStreak);

  showScreen('screen-home');
  el('modal-complete').classList.add('show');

  if(leveledUp){
    setTimeout(()=>{
      el('modal-complete').classList.remove('show');
      el('levelup-num').textContent = toEastern(PlayerState.level);
      el('modal-levelup').classList.add('show');
      AudioFX.levelup();
      confettiBurst(70);
    }, 350);
  } else if(pct >= 80){
    confettiBurst(40);
  }
}

/* ---------------------------------------------------------------
   6. EVENT WIRING
   --------------------------------------------------------------- */
document.querySelectorAll('.cat-card').forEach(card=>{
  card.addEventListener('click', ()=> startCategory(card.dataset.cat));
});
el('quiz-back').addEventListener('click', ()=>{ AudioFX.click(); showScreen('screen-home'); refreshHomeUI(); });
el('quiz-next').addEventListener('click', nextQuestion);
el('levelup-close').addEventListener('click', ()=>{ el('modal-levelup').classList.remove('show'); });
el('complete-close').addEventListener('click', ()=>{ el('modal-complete').classList.remove('show'); });

/* init */
refreshHomeUI();
</script>
