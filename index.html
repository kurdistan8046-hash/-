<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاری فێربوونی وشە و بیرکاری</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #278e43; /* Green from flag */
            --danger: #ed2024; /* Red from flag */
            --warning: #f9af1b; /* Yellow from flag */
            --text-main: #333333;
        }

        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main);
            text-align: center; 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header & Flag */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .flag {
            width: 50px; height: 33px;
            display: flex; flex-direction: column;
            border-radius: 4px; overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .flag .red { background: #ed2024; flex: 1; }
        .flag .white { background: #ffffff; flex: 1; display: flex; justify-content: center; align-items: center; position: relative;}
        .flag .white::after { content: '☀️'; position: absolute; font-size: 14px; color: #f9af1b; }
        .flag .green { background: #278e43; flex: 1; }

        .stats { font-size: 18px; font-weight: bold; }
        .stats span { color: var(--primary); margin: 0 5px; }

        /* Game Board */
        .game-board {
            background: var(--card-bg);
            width: 100%; max-width: 600px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        .mode-toggle {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
        }
        .mode-btn {
            background: #eee; border: none; padding: 10px 20px;
            border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold;
            transition: 0.3s;
        }
        .mode-btn.active { background: var(--primary); color: white; }

        #display-area {
            font-size: 100px; 
            margin: 20px 0; 
            min-height: 120px;
            display: flex; justify-content: center; align-items: center;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        #options { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        
        .btn { 
            background-color: var(--primary); 
            color: white; border: none; 
            padding: 15px 30px; font-size: 24px; 
            border-radius: 12px; cursor: pointer; 
            transition: 0.2s; min-width: 120px;
            box-shadow: 0 4px 6px rgba(39, 142, 67, 0.3); 
        }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }

        #message { font-size: 24px; font-weight: bold; margin-top: 20px; min-height: 35px; }

        /* Progress Bar */
        .progress-container { width: 100%; background: #eee; border-radius: 10px; margin-top: 20px; height: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--warning); width: 0%; transition: width 0.5s ease; }

        /* Animations */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .shake { animation: shake 0.3s; }
        .glow { box-shadow: 0 0 20px 10px rgba(39,142,67,0.3) !important; transition: 0.3s; }

        /* Simple Confetti */
        .confetti { position: absolute; width: 10px; height: 10px; opacity: 0; pointer-events: none; }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(200px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Header (Level & Flag) -->
    <div class="header">
        <div class="flag">
            <div class="red"></div><div class="white"></div><div class="green"></div>
        </div>
        <div class="stats">
            ئاست: <span id="levelDisplay">1</span> | خاڵ: <span id="xpDisplay">0</span>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="game-board" id="board">
        <div class="mode-toggle">
            <button class="mode-btn active" id="btnReading" onclick="setMode('reading')">📖 فێربوونی وشە</button>
            <button class="mode-btn" id="btnMath" onclick="setMode('math')">🔢 بیرکاری</button>
        </div>

        <div id="display-area">🍎</div>
        <div id="options"></div>
        <p id="message"></p>
        
        <div class="progress-container">
            <div class="progress-bar" id="xpBar"></div>
        </div>
    </div>

    <script>
        // داتابەیسی وشەکان (دەتوانیت زیاتری بکەیت)
        const dictionary = [
            { emoji: '🍎', word: 'سێو' }, { emoji: '🍌', word: 'مۆز' }, { emoji: '🍇', word: 'ترێ' },
            { emoji: '🍉', word: 'شوتی' }, { emoji: '🍓', word: 'شلیک' }, { emoji: '🐈', word: 'پشیلە' },
            { emoji: '🐕', word: 'سەگ' }, { emoji: '🐓', word: 'مریشک' }, { emoji: '🐄', word: 'مانگا' },
            { emoji: '🏠', word: 'ماڵ' }, { emoji: '🚪', word: 'دەرگا' }, { emoji: '🪟', word: 'پەنجەرە' },
            { emoji: '☀️', word: 'خۆر' }, { emoji: '🌙', word: 'مانگ' }, { emoji: '⭐', word: 'ئەستێرە' },
            { emoji: '🌳', word: 'درەخت' }, { emoji: '🚗', word: 'ئۆتۆمبێل' }, { emoji: '✈️', word: 'فڕۆکە' }
        ];

        // گۆڕاوەکان
        let currentMode = 'reading';
        let level = parseInt(localStorage.getItem('kurdGameLevel')) || 1;
        let xp = parseInt(localStorage.getItem('kurdGameXP')) || 0;
        let xpNeeded = level * 50;
        let currentAnswer = '';

        // نوێکردنەوەی شاشە
        function updateUI() {
            document.getElementById('levelDisplay').innerText = level;
            document.getElementById('xpDisplay').innerText = xp;
            let xpPercent = (xp / xpNeeded) * 100;
            document.getElementById('xpBar').style.width = xpPercent + '%';
        }

        // سەیڤکردنی داتاکان
        function saveData() {
            localStorage.setItem('kurdGameLevel', level);
            localStorage.setItem('kurdGameXP', xp);
            xpNeeded = level * 50;
            updateUI();
        }

        // گۆڕینی مۆد
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnReading').classList.remove('active');
            document.getElementById('btnMath').classList.remove('active');
            if(mode === 'reading') document.getElementById('btnReading').classList.add('active');
            if(mode === 'math') document.getElementById('btnMath').classList.add('active');
            document.getElementById('message').innerText = '';
            loadQuestion();
        }

        // تێکەڵکردنی وەڵامەکان هەڕەمەکی
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // دروستکردنی پرسیار
        function loadQuestion() {
            const display = document.getElementById('display-area');
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            display.style.fontSize = '100px';

            let options = [];

            if (currentMode === 'reading') {
                // مۆدی فێربوونی وشەکان
                let correctItem = dictionary[Math.floor(Math.random() * dictionary.length)];
                currentAnswer = correctItem.word;
                display.innerText = correctItem.emoji;

                options.push(correctItem.word);
                while(options.length < 3) {
                    let randomItem = dictionary[Math.floor(Math.random() * dictionary.length)].word;
                    if(!options.includes(randomItem)) options.push(randomItem);
                }
            } else {
                // مۆدی بیرکاری (پێشکەوتوو بەپێی ئاست)
                display.style.fontSize = '80px';
                let num1, num2, sign;
                
                if (level <= 3) { // کۆکردنەوەی سادە
                    num1 = Math.floor(Math.random() * 5) + 1;
                    num2 = Math.floor(Math.random() * 5) + 1;
                    sign = '+';
                    currentAnswer = (num1 + num2).toString();
                } else if (level <= 6) { // کۆکردنەوەی گەورەتر
                    num1 = Math.floor(Math.random() * 10) + 5;
                    num2 = Math.floor(Math.random() * 10) + 1;
                    sign = '+';
                    currentAnswer = (num1 + num2).toString();
                } else { // لێدەرکردن
                    num1 = Math.floor(Math.random() * 15) + 10;
                    num2 = Math.floor(Math.random() * 10) + 1;
                    sign = '-';
                    currentAnswer = (num1 - num2).toString();
                }

                display.innerText = `${num1} ${sign} ${num2}`;
                
                options.push(currentAnswer);
                while(options.length < 3) {
                    let wrongAnswer = parseInt(currentAnswer) + (Math.floor(Math.random() * 5) * (Math.random() > 0.5 ? 1 : -1)) + 1;
                    if(!options.includes(wrongAnswer.toString()) && wrongAnswer >= 0) options.push(wrongAnswer.toString());
                }
            }

            // پیشاندانی دوگمەکان
            options = shuffleArray(options);
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsDiv.appendChild(btn);
            });
        }

        // پشکنینی وەڵام
        function checkAnswer(selected, btnElement) {
            const msg = document.getElementById('message');
            const board = document.getElementById('board');
            
            // ڕێگری لە داگرتنی خێرا
            const allBtns = document.querySelectorAll('.btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === currentAnswer) {
                // وەڵامی ڕاست
                msg.innerText = 'ئافەرین پاڵەوان! 👏';
                msg.style.color = 'var(--primary)';
                board.classList.add('glow');
                btnElement.style.backgroundColor = '#1e7b36'; // تۆختر
                
                createConfetti(); // ئاهەنگگێڕان بە ڕەنگەکانی ئاڵای کوردستان

                xp += 15;
                if (xp >= xpNeeded) {
                    level++;
                    xp = 0;
                    msg.innerText = `ئافەرین! چوویتە ئاستی ${level} 🎉`;
                }
                saveData();

                setTimeout(() => { 
                    board.classList.remove('glow');
                    msg.innerText = ''; 
                    loadQuestion(); 
                }, 1500);

            } else {
                // وەڵامی هەڵە
                msg.innerText = 'نەخێر، هەڵەیە. دووبارە هەوڵ بدەرەوە!';
                msg.style.color = 'var(--danger)';
                board.classList.add('shake');
                btnElement.style.backgroundColor = 'var(--danger)';
                
                setTimeout(() => { 
                    board.classList.remove('shake'); 
                    msg.innerText = '';
                    btnElement.style.backgroundColor = 'var(--primary)';
                    allBtns.forEach(b => b.disabled = false);
                }, 1000);
            }
        }

        // دروستکردنی پەڕەی ئاهەنگ (بە ڕەنگەکانی ئاڵای کوردستان)
        function createConfetti() {
            const board = document.getElementById('board');
            const colors = ['#ed2024', '#278e43', '#f9af1b', '#ffffff']; // سور، سەوز، زەرد، سپی
            
            for (let i = 0; i < 20; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '10%';
                conf.style.animation = `fall ${Math.random() * 1 + 1}s linear`;
                board.appendChild(conf);
                
                setTimeout(() => { conf.remove(); }, 2000);
            }
        }

        // دەستپێکردن
        updateUI();
        loadQuestion();
    </script>
</body>
</html>
